  /dynamicpricing/v10/operators/{operatorID}/evse-pricing:
    post:
      summary: eRoamingPushEVSEPricing_V1.0
      operationId: eRoamingPushEVSEPricing_V1.0
      description: "__Note:__\n  * To `SEND`\n  * Implementation: `OPTIONAL`\nWhen a CPO sends an eRoamingPushEVSEPricing\
        \ request, Hubject checks whether there is a valid flexible/dynamic pricing service offer (for\
        \ the service type Authorization) created by the CPO. If so, the operation allows the upload of\
        \ a list containing pricing product assignment to EvseIDs to Hubject. In addition, it is also\
        \ possible to update or delete EVSE pricing data previously pushed with an upload operation request.\
        \ How the transferred data is to be processed `MUST` be defined in the “ActionType” field of the\
        \ request. Four processing options (i.e. Action Types) exist, details of which can be seen in\
        \ section eRoamingPushEVSEPricing).\n\nThe EVSE pricing data to be processed `MUST` be provided\
        \ in the “EVSEPricing” field, which consists of “EvseIDProductList” structures. Hubject keeps\
        \ a history of all updated and changed data records. Every successful push operation – irrespective\
        \ of the performed action – leads to a new version of currently valid data records. Furthermore,\
        \ every operation is logged with the current timestamp. Thus, Hubject can reconstruct the status\
        \ of EVSE pricing data for every point in time in the past.\n\nEVSE consistency:\n\nEvseIDs contain\
        \ the ID of the corresponding CPO (With every EVSE pricing data upload operation, Hubject checks\
        \ whether the given CPO’s OperatorID or Sub-OperatorIDs if necessary) matches every given EvseID\
        \ sent in the request. If not, Hubject refuses the data upload and responds with the status code\
        \ 018.\n\nNote\n\nThe eRoamingPushEVSEPricing operation `MUST` always be used sequentially.\n"
      tags:
      - eRoamingDynamicPricing
      parameters:
      - name: operatorID
        in: path
        required: true
        description: The id of the operator
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: eRoamingPushEVSEPricing is a message that is sent in order to upload a list
                of EVSEs and the pricing products (i.e. tarrifs) applicable for (charging or reservation)
                sessions at these EVSEs.
              required:
              - ActionType
              - EVSEPricing
              properties:
                ActionType:
                  type: string
                  enum:
                  - fullLoad
                  - update
                  - insert
                  - delete
                  description: Describes the action that has to be performed by Hubject with the provided
                    data.
                EVSEPricing:
                  type: array
                  description: A list of EVSEs and their respective pricing product relation
                  items:
                    type: object
                    required:
                    - EvseID
                    - ProviderID
                    - EvseIDProductList
                    properties:
                      EvseID:
                        type: string
                        pattern: ^(([A-Za-z]{2}\*?[A-Za-z0-9]{3}\*?E[A-Za-z0-9\*]{1,30})|(\+?[0-9]{1,3}\*[0-9]{3}\*[0-9\*]{1,32}))$
                        description: 'The ID that identifies the charging spot.


                          A string that `MUST` be valid with respect to the following regular expression:
                          ISO | DIN.


                          `^(([A-Za-z]{2}\*?[A-Za-z0-9]{3}\*?E[A-Za-z0-9\*]{1,30})|(\+?[0-9]{1,3}\*[0-9]{3}\*[0-9\*]{1,32}))$`

                          The expression validates the string as EvseID. It supports both definitions
                          DIN SPEC 91286:2011-11 as well as ISO 15118-1.


                          In case the EvseID is provided corresponding to ISO, the country code MUST be
                          provided as Alpha-2-Code (DIN EN ISO-3166-1) and the separator character “*”
                          is optional. Furthermore the ID MUST provide an “E” after the OperatorID in
                          order to identify the ID as ISO EvseID without doubt.


                          In case the EvseID is provided corresponding to DIN, the country code MUST be
                          provided according to the international telecommunication numbering plan (ITU-T
                          E.164:11/2010) and the separator character “*” is mandatory.


                          Examples ISO: “DE*AB7*E840*6487”, “DEAB7E8406487”


                          Example DIN: “+49*810*000*438”

                          '
                        example: +49*810*000*438
                      ProviderID:
                        type: string
                        pattern: ^([A-Za-z]{2}\-?[A-Za-z0-9]{3}|[A-Za-z]{2}[\*|-]?[A-Za-z0-9]{3})|\*$
                        description: "The ProviderID is defined by Hubject and is used to identify the\
                          \ EMP\n\nA string that `MUST` be valid with respect to the following regular\
                          \ expression: ISO | DIN\n\n`^([A-Za-z]{2}\\-?[A-Za-z0-9]{3}|[A-Za-z]{2}[\\*|-]?[A-Za-z0-9]{3})$`\n\
                          \nThe expression validates the string as ProviderID including the preceding\
                          \ country code, which is part of EvcoID. It supports both definitions DIN SPEC\
                          \ 91286:2011-11 as well as ISO 15118-1.\n\nIn case the ProviderID is provided\
                          \ corresponding to ISO, the country code `MUST` be provided as Alpha-2-Code\
                          \ (DIN EN ISO-3166-1) and the separator character “-” is optional.\n\nExamples\
                          \ ISO: “DE8EO”, “DE-8EO”\n\nExamples DIN: “DE8EO”, “DE*8EO”, “DE-8EO”\n\n In\
                          \ case the data is to be made available for all EMPs (e.g. for Offer-to-All\
                          \ prices), the asterix character (*) can be set as the value in this field.\n\
                          \ \n"
                        example: DE-8EO
                      EvseIDProductList:
                        type: array
                        description: A list of pricing products applicable per EvseID
                        items:
                          type: string
                          description: 'The ProductIDType defines some standard values (see below). The
                            type however also supports custom ProductIDs that can be specified by partners
                            (as a string of 50 characters maximum length).

                            | Option | Description |

                            |--------|-------------|

                            | Standard Price | Standard Price |

                            | AC1 | Product for AC 1 Phase charging |

                            | AC3 | Product for AC 3 Phase charging |

                            | DC | Product for DC charging |

                            | CustomProductID | There is no option “CustomProductID”, this sample option
                            is meant to indicates that custom product ID specifications by partners (as
                            a string of 50 characters maximum length) are allowed as well.|

                            '
                          example: AC1
                          maximum: 50
              example:
                ActionType: fullLoad
                EVSEPricing:
                - EvseID: DE*XYZ*ETEST1
                  EvseIDProductList:
                  - AC 1
                  ProviderID: '*'
