paths:
  /charging/v21/operators/{operatorID}/authorize/start:
    post:
      summary: eRoamingAuthorizeStart_v2.1
      operationId: eRoamingAuthorizeStart_v2.1
      description: "__Note:__\n  * To `SEND`\n  * Implementation: `MANDATORY`\n\n__Functional Description:__\n\
        \nScenario:\n\nA customer of an EMP wants to charge a vehicle at a charging point of a CPO. The\
        \ customer authenticates at the charging point. The CPO’s operator system does not recognize the\
        \ customer’s authentication data. In order to authorize the charging process, the CPO’s system\
        \ can send an eRoamingAuthorizeStart request to Hubject. The request MUST contain the OperatorID\
        \ and the identification data (e.g. UID or EvcoID) and MAY contain the EvseID.\n\nHubject generates\
        \ a SessionID for the charging process and persists important session data (SessionID, EvseID,\
        \ identification data).\n\nRegarding the further service processing, there are three different\
        \ options:\n\na. Hubject first tries to authorize the customer offline by checking authentication\
        \ master data. Authentication data can be uploaded by EMPs using the eRoamingAuthenticationData\
        \ service.\n![Authorize Start offline diagram](images/authorizestart_offline.png)\n\nb. In case\
        \ offline authorization is not possible, Hubject tries to derive the EMP from the provided identification\
        \ data. QR Code and Plug&Charge identification data contain the EvcoID. Hubject can derive the\
        \ EMP’s ProviderID from the EvcoID. Hubject will directly forward eRoamingAuthorizeStart requests\
        \ to the EMP. The EMP provider system checks the requested authentication data and responds accordingly,\
        \ either by authorizing or not authorizing the request. The response `MUST` contain the ProviderID\
        \ and the AuthorizationStatus and `MAY` contain a list of identification data that is authorized\
        \ to stop the charging process. In case that the EMP provider system cannot be addressed (e.g.\
        \ due to technical problems), the corresponding provider will be dealt with as if responding “NotAuthorized”.\n\
        ![Authorize evco diagram](images/authorize_evco.png)\n\nc. In case that Hubject cannot derive\
        \ the EMP from the identification data (e.g. with RFID identification), Hubject identifies all\
        \ EMPs that are under contract with the CPO (EMPs must be the service subscriber) and forwards\
        \ the eRoamingAuthorizeStart request to all these EMPs (broadcast). Hubject consolidates all EMP\
        \ responses and creates an overall response, authorizing the request in case that one EMP authorized\
        \ the request.\n\n![Authorize Start online diagram](images/authorizestart_online.png)\n\n__Pin\
        \ Security:__\n\nThe eRoamingAuthorizeStart request contains one of the defined identification\
        \ types (see IdentificationType). The identification type “QRCodeIdentificationType” (see QRCodeIdentificationType)\
        \ contains - besides the “EvcoID” field - a “PIN” field or a “HashedPIN” field (only one of the\
        \ two options must be provided).\n\nFor security reasons and as a general rule, Hubject does not\
        \ store PINs in clear text, but always as encrypted hash values. In order to prevent hashed PIN\
        \ values that may have been picked illegally from being used to request the authorization for\
        \ charging processes, the PIN value `MUST` always be provided in clear text within the eRoamingAuthorizeStart\
        \ request. This means that this operation `MUST` always provide the “PIN” field (clear text).\
        \ Hubject will always generate a hash value of the provided PIN before checking the offline authentication\
        \ data. So, in case that a PIN is provided by mistake as hashed value, Hubject automatically generates\
        \ a hash of a hash, which eventually leads to a denial of authorization\n\nIn order to create\
        \ hash values, Hubject applies the hash algorithm that the EMP has assigned to the QR Code identification\
        \ record\n"
      tags:
      - eRoamingAuthorization
      parameters:
      - name: operatorID
        in: path
        required: true
        description: The id of the operator
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'Best Practices:

                * The EVSE ID is optional for this message which is e.g. defined after the RFID authorization
                at a charge point. If the Evse ID can be provided, we recommend to include the EVSE ID
                in this message; it will help for support matters.

                * If an authorization process could not successfully be executed, please set an error
                code by refering to the error code list mentioned in the OICP document.

                '
              required:
              - OperatorID
              - Identification
              properties:
                SessionID:
                  type: string
                  pattern: ^[A-Za-z0-9]{8}(-[A-Za-z0-9]{4}){3}-[A-Za-z0-9]{12}$
                  description: 'The Hubject SessionID that identifies the process


                    A string that `MUST` be valid with respect to the following regular expression:


                    `^[A-Za-z0-9]{8}(-[A-Za-z0-9]{4}){3}-[A-Za-z0-9]{12}$`


                    The expression validates the string as a GUID.


                    Example: “b2688855-7f00-0002-6d8e-48d883f6abb6”

                    '
                  example: b2688855-7f00-0002-6d8e-48d883f6abb6
                CPOPartnerSessionID:
                  type: string
                  maximum: 250
                  description: Optional field containing the session id assigned by the CPO to the related
                    operation.
                EMPPartnerSessionID:
                  type: string
                  maximum: 250
                  description: Optional field containing the session id assigned by an EMP to the related
                    operation.
                OperatorID:
                  type: string
                  pattern: ^(([A-Za-z]{2}\*?[A-Za-z0-9]{3})|(\+?[0-9]{1,3}\*[0-9]{3}))$
                  description: 'A string that MUST be valid with respect to the following regular expression:
                    ISO | DIN


                    ^(([A-Za-z]{2}\*?[A-Za-z0-9]{3})|(\+?[0-9]{1,3}\*[0-9]{3}))$

                    The expression validates the string as OperatorID including the preceding country
                    code, which is part of EvseID. It supports both definitions DIN SPEC 91286:2011-11
                    as well as ISO 15118. In case the OperatorID is provided corresponding to ISO, the
                    country code MUST be provided as Alpha-2-Code (DIN EN ISO-3166-1) and the separator
                    character “*” is optional.


                    In case the OperatorID is provided corresponding to DIN, the country code MUST be
                    provided according to the international telecommunication numbering plan (ITU-T E.164:11/2010)
                    and the separator character “*” is mandatory.


                    Examples ISO: “DE*A36”, “DEA36”


                    Example DIN: “+49*536”

                    '
                  example: +49*536
                EvseID:
                  type: string
                  pattern: ^(([A-Za-z]{2}\*?[A-Za-z0-9]{3}\*?E[A-Za-z0-9\*]{1,30})|(\+?[0-9]{1,3}\*[0-9]{3}\*[0-9\*]{1,32}))$
                  description: 'The ID that identifies the charging spot.


                    A string that `MUST` be valid with respect to the following regular expression: ISO
                    | DIN.


                    `^(([A-Za-z]{2}\*?[A-Za-z0-9]{3}\*?E[A-Za-z0-9\*]{1,30})|(\+?[0-9]{1,3}\*[0-9]{3}\*[0-9\*]{1,32}))$`

                    The expression validates the string as EvseID. It supports both definitions DIN SPEC
                    91286:2011-11 as well as ISO 15118-1.


                    In case the EvseID is provided corresponding to ISO, the country code MUST be provided
                    as Alpha-2-Code (DIN EN ISO-3166-1) and the separator character “*” is optional. Furthermore
                    the ID MUST provide an “E” after the OperatorID in order to identify the ID as ISO
                    EvseID without doubt.


                    In case the EvseID is provided corresponding to DIN, the country code MUST be provided
                    according to the international telecommunication numbering plan (ITU-T E.164:11/2010)
                    and the separator character “*” is mandatory.


                    Examples ISO: “DE*AB7*E840*6487”, “DEAB7E8406487”


                    Example DIN: “+49*810*000*438”

                    '
                  example: +49*810*000*438
                Identification:
                  type: object
                  description: 'Authentication data


                    1. The option RFIDIdentification `MUST` not be used in the eRoamingAuthorization process.
                    For RFID Authorization, only the option RFIDMifareFamilyIdentification `SHOULD` be
                    used in the respective eRoamingAuthorization messages.

                    2. For the Remote Authorization process, only the option RemoteIdentification MUST
                    be used in the respective messages.

                    '
                  properties:
                    RFIDMifareFamilyIdentification:
                      type: object
                      description: 'Authentication data details. The data structure differs depending
                        on the authentication technology

                        '
                      properties:
                        UID:
                          type: string
                          pattern: ^([0-9A-F]{8,8}|[0-9A-F]{14,14}|[0-9A-F]{20,20})$
                          description: 'Authentication data details. The data structure differs depending
                            on the authentication technology


                            The expression validates the string as a unique RFID with a length of 8, 14
                            or 20 characters.


                            Examples: “7568290FFF765F”

                            '
                          example: 7568290FFF765F
                      required:
                      - UID
                      example:
                        UID: 7568290FFF765F
                    RFIDIdentification:
                      type: object
                      description: 'Authentication data details. The data structure differs depending
                        on the authentication technology

                        '
                      properties:
                        UID:
                          type: string
                          pattern: ^([0-9A-F]{8,8}|[0-9A-F]{14,14}|[0-9A-F]{20,20})$
                          description: 'Authentication data details. The data structure differs depending
                            on the authentication technology


                            The expression validates the string as a unique RFID with a length of 8, 14
                            or 20 characters.


                            Examples: “7568290FFF765F”

                            '
                          example: 7568290FFF765F
                        EvcoID:
                          type: string
                          pattern: ^(([A-Za-z]{2}\-?[A-Za-z0-9]{3}\-?C[A-Za-z0-9]{8}\-?[\d|A-Za-z])|([A-Za-z]{2}[\*|\-]?[A-Za-z0-9]{3}[\*|\-]?[A-Za-z0-9]{6}[\*|\-]?[\d|X]))$
                          description: 'A string that `MUST` be valid with respect to the following regular
                            expression: ISO | DIN.


                            ^(([A-Za-z]{2}\-?[A-Za-z0-9]{3}\-?C[A-Za-z0-9]{8}\-?[\d|A-Za-z])|([A-Za-z]{2}[\*|\-]?[A-Za-z0-9]{3}[\*|\-]?[A-Za-z0-9]{6}[\*|\-]?[\d|X]))$

                            The expression validates the string as EvcoID. It supports both definitions
                            DIN SPEC 91286:2011-11 as well as ISO 15118-1.


                            In case the EvcoID is provided corresponding to ISO, the instance part MUST
                            be eight characters long and MUST be provided with a prepended “C”. The optional
                            separating character MUST be “-“.


                            In case the EvcoID is provided corresponding to DIN, the instance part MUST
                            be six characters long. The optional separating character can either be “*”
                            or “-“.


                            Examples ISO: “DE-8EO-CAet5e4XY-3”, “DE8EOCAet5e43X1”


                            Examples DIN: “DE*8EO*Aet5e4*3”, “DE-8EO-Aet5e4-3”, “DE8EOAet5e43”

                            '
                          example: DE*8EO*Aet5e4*3
                        RFID:
                          type: string
                          description: 'Defined RFID Type

                            '
                          enum:
                          - mifareCls
                          - mifareDes
                          - calypso
                          - nfc
                          - mifareFamily
                        PrintedNumber:
                          type: string
                          maximum: 150
                          description: A number printed on a customer’s card for manual authorization
                            (e.q. via a call center)
                        ExpiryDate:
                          type: string
                          description: Until when this card is valid. Should not be set if card does not
                            have an expiration
                      required:
                      - UID
                      - RFID
                      example:
                        UID: 7568290FFF765F
                        RFID: mifareCls
                    QRCodeIdentification:
                      type: object
                      required:
                      - EvcoID
                      properties:
                        EvcoID:
                          type: string
                          pattern: ^(([A-Za-z]{2}\-?[A-Za-z0-9]{3}\-?C[A-Za-z0-9]{8}\-?[\d|A-Za-z])|([A-Za-z]{2}[\*|\-]?[A-Za-z0-9]{3}[\*|\-]?[A-Za-z0-9]{6}[\*|\-]?[\d|X]))$
                          description: 'A string that `MUST` be valid with respect to the following regular
                            expression: ISO | DIN.


                            ^(([A-Za-z]{2}\-?[A-Za-z0-9]{3}\-?C[A-Za-z0-9]{8}\-?[\d|A-Za-z])|([A-Za-z]{2}[\*|\-]?[A-Za-z0-9]{3}[\*|\-]?[A-Za-z0-9]{6}[\*|\-]?[\d|X]))$

                            The expression validates the string as EvcoID. It supports both definitions
                            DIN SPEC 91286:2011-11 as well as ISO 15118-1.


                            In case the EvcoID is provided corresponding to ISO, the instance part MUST
                            be eight characters long and MUST be provided with a prepended “C”. The optional
                            separating character MUST be “-“.


                            In case the EvcoID is provided corresponding to DIN, the instance part MUST
                            be six characters long. The optional separating character can either be “*”
                            or “-“.


                            Examples ISO: “DE-8EO-CAet5e4XY-3”, “DE8EOCAet5e43X1”


                            Examples DIN: “DE*8EO*Aet5e4*3”, “DE-8EO-Aet5e4-3”, “DE8EOAet5e43”

                            '
                          example: DE*8EO*Aet5e4*3
                        HashedPIN:
                          type: object
                          required:
                          - Value
                          - Function
                          properties:
                            Value:
                              type: string
                              pattern: ^[0-9A-Za-z\\.+/=\\$]{10,100}$
                              description: 'Hash value created by partner


                                The expression validates the string as a hash function result value with
                                a length between 10 and 100 characters


                                Example: “a5ghdhf73h”

                                '
                              example: a5ghdhf73h
                            Function:
                              type: string
                              enum:
                              - Bcrypt
                              description: Function that was used to generate the hash value.
                              example: Bcrypt
                            LegacyHashData:
                              type: object
                              required:
                              - Function
                              properties:
                                Function:
                                  type: string
                                  enum:
                                  - MD5
                                  - SHA-1
                                  description: Function used for hashing of the PIN at the partner.
                                  example: SHA-1
                                Salt:
                                  type: string
                                  minimum: 0
                                  maximum: 100
                                  description: The salt value used by the partner for hashing the PIN.
                                  example: example-salt
                                Value:
                                  type: string
                                  minimum: 0
                                  maximum: 20
                                  description: PIN hash at the partner.
                                  example: a5ghdhf73h
                        PIN:
                          type: string
                    PlugAndChargeIdentification:
                      type: object
                      description: 'Authentication required for Plug&Charge (EMAID/EVCOID)

                        '
                      properties:
                        EvcoID:
                          type: string
                          pattern: ^(([A-Za-z]{2}\-?[A-Za-z0-9]{3}\-?C[A-Za-z0-9]{8}\-?[\d|A-Za-z])|([A-Za-z]{2}[\*|\-]?[A-Za-z0-9]{3}[\*|\-]?[A-Za-z0-9]{6}[\*|\-]?[\d|X]))$
                          description: 'A string that `MUST` be valid with respect to the following regular
                            expression: ISO | DIN.


                            ^(([A-Za-z]{2}\-?[A-Za-z0-9]{3}\-?C[A-Za-z0-9]{8}\-?[\d|A-Za-z])|([A-Za-z]{2}[\*|\-]?[A-Za-z0-9]{3}[\*|\-]?[A-Za-z0-9]{6}[\*|\-]?[\d|X]))$

                            The expression validates the string as EvcoID. It supports both definitions
                            DIN SPEC 91286:2011-11 as well as ISO 15118-1.


                            In case the EvcoID is provided corresponding to ISO, the instance part MUST
                            be eight characters long and MUST be provided with a prepended “C”. The optional
                            separating character MUST be “-“.


                            In case the EvcoID is provided corresponding to DIN, the instance part MUST
                            be six characters long. The optional separating character can either be “*”
                            or “-“.


                            Examples ISO: “DE-8EO-CAet5e4XY-3”, “DE8EOCAet5e43X1”


                            Examples DIN: “DE*8EO*Aet5e4*3”, “DE-8EO-Aet5e4-3”, “DE8EOAet5e43”

                            '
                          example: DE*8EO*Aet5e4*3
                      required:
                      - EvcoID
                      example:
                        EvcoID: DE*8EO*Aet5e4*3
                    RemoteIdentification:
                      type: object
                      description: 'Authentication data details. The data structure differs depending
                        on the authentication technology

                        '
                      properties:
                        EvcoID:
                          type: string
                          pattern: ^(([A-Za-z]{2}\-?[A-Za-z0-9]{3}\-?C[A-Za-z0-9]{8}\-?[\d|A-Za-z])|([A-Za-z]{2}[\*|\-]?[A-Za-z0-9]{3}[\*|\-]?[A-Za-z0-9]{6}[\*|\-]?[\d|X]))$
                          description: 'A string that `MUST` be valid with respect to the following regular
                            expression: ISO | DIN.


                            ^(([A-Za-z]{2}\-?[A-Za-z0-9]{3}\-?C[A-Za-z0-9]{8}\-?[\d|A-Za-z])|([A-Za-z]{2}[\*|\-]?[A-Za-z0-9]{3}[\*|\-]?[A-Za-z0-9]{6}[\*|\-]?[\d|X]))$

                            The expression validates the string as EvcoID. It supports both definitions
                            DIN SPEC 91286:2011-11 as well as ISO 15118-1.


                            In case the EvcoID is provided corresponding to ISO, the instance part MUST
                            be eight characters long and MUST be provided with a prepended “C”. The optional
                            separating character MUST be “-“.


                            In case the EvcoID is provided corresponding to DIN, the instance part MUST
                            be six characters long. The optional separating character can either be “*”
                            or “-“.


                            Examples ISO: “DE-8EO-CAet5e4XY-3”, “DE8EOCAet5e43X1”


                            Examples DIN: “DE*8EO*Aet5e4*3”, “DE-8EO-Aet5e4-3”, “DE8EOAet5e43”

                            '
                          example: DE*8EO*Aet5e4*3
                      required:
                      - EvcoID
                      example:
                        EvcoID: DE*8EO*Aet5e4*3
                PartnerProductID:
                  type: string
                  description: 'The ProductIDType defines some standard values (see below). The type however
                    also supports custom ProductIDs that can be specified by partners (as a string of
                    50 characters maximum length).

                    | Option | Description |

                    |--------|-------------|

                    | Standard Price | Standard Price |

                    | AC1 | Product for AC 1 Phase charging |

                    | AC3 | Product for AC 3 Phase charging |

                    | DC | Product for DC charging |

                    | CustomProductID | There is no option “CustomProductID”, this sample option is meant
                    to indicates that custom product ID specifications by partners (as a string of 50
                    characters maximum length) are allowed as well.|

                    '
                  example: AC1
                  maximum: 50
              example:
                CPOPartnerSessionID: 1234XYZ
                EMPPartnerSessionID: TestSession
                EvseID: DE*XYZ*ETEST1
                Identification:
                  RFIDMifareFamilyIdentification:
                    UID: 1234ABCD
                  QRCodeIdentification:
                    EvcoID: DE-DCB-C12345678-X
                    HashedPIN:
                      Function: Bcrypt
                      LegacyHashData:
                        Function: MD5
                        Salt: string
                        Value: string123456
                      Value: string123456
                    PIN: '1234'
                  PlugAndChargeIdentification:
                    EvcoID: DE-DCB-C12345678-X
                  RemoteIdentification:
                    EvcoID: DE-DCB-C12345678-X
                  RFIDIdentification:
                    EvcoID: DE-DCB-C12345678-X
                    ExpiryDate: '2021-01-23T14:21:23.744Z'
                    PrintedNumber: '9876655'
                    RFID: mifareCls
                    UID: 1234ABCD
                OperatorID: DE*ABC
                PartnerProductID: AC 1
                SessionID: f98efba4-02d8-4fa0-b810-9a9d50d2c527
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                type: object
                description: "Note:\n  * To `RECEIVE`\n  * Implementation: `MANDATORY`\n\neRoamingAuthorizationStart\
                  \ is a message that authorizes a user to charge a car. NOTE: This message describes\
                  \ the response which has to be receive in response to the eRoamingAuthorizeStart.\n"
                required:
                - AuthorizationStatus
                - StatusCode
                properties:
                  SessionID:
                    type: string
                    pattern: ^[A-Za-z0-9]{8}(-[A-Za-z0-9]{4}){3}-[A-Za-z0-9]{12}$
                    description: 'The Hubject SessionID that identifies the process


                      A string that `MUST` be valid with respect to the following regular expression:


                      `^[A-Za-z0-9]{8}(-[A-Za-z0-9]{4}){3}-[A-Za-z0-9]{12}$`


                      The expression validates the string as a GUID.


                      Example: “b2688855-7f00-0002-6d8e-48d883f6abb6”

                      '
                    example: b2688855-7f00-0002-6d8e-48d883f6abb6
                  CPOPartnerSessionID:
                    type: string
                    maximum: 250
                    description: Optional field containing the session id assigned by the CPO to the related
                      operation.
                  EMPPartnerSessionID:
                    type: string
                    maximum: 250
                    description: Optional field containing the session id assigned by an EMP to the related
                      operation.
                  ProviderID:
                    type: string
                    pattern: ^([A-Za-z]{2}\-?[A-Za-z0-9]{3}|[A-Za-z]{2}[\*|-]?[A-Za-z0-9]{3})$
                    description: 'The ProviderID is defined by Hubject and is used to identify the EMP


                      A string that `MUST` be valid with respect to the following regular expression:
                      ISO | DIN


                      `^([A-Za-z]{2}\-?[A-Za-z0-9]{3}|[A-Za-z]{2}[\*|-]?[A-Za-z0-9]{3})$`


                      The expression validates the string as ProviderID including the preceding country
                      code, which is part of EvcoID. It supports both definitions DIN SPEC 91286:2011-11
                      as well as ISO 15118-1.


                      In case the ProviderID is provided corresponding to ISO, the country code `MUST`
                      be provided as Alpha-2-Code (DIN EN ISO-3166-1) and the separator character “-”
                      is optional.


                      Examples ISO: “DE8EO”, “DE-8EO”


                      Examples DIN: “DE8EO”, “DE*8EO”, “DE-8EO”

                      '
                    example: DE-8EO
                  AuthorizationStatus:
                    type: string
                    enum:
                    - Authorized
                    - NotAuthorized
                    description: 'Information specifying whether the user is authorized to charge or not.


                      | Option | Description |

                      | ------ | ----------- |

                      | Authorized | User is authorized |

                      | NotAuthorized | User is not authorized |

                      '
                  StatusCode:
                    type: object
                    description: 'The structure consists of a defined code, an optional functional description
                      of the status, and optional additional information. It can be used e.g. to send
                      error details or detailed reasons for a certain process or system behavior. The
                      optional AdditionalInfo field can be used in order to provide further individual
                      (non-standardized) information.

                      '
                    required:
                    - Code
                    properties:
                      Code:
                        type: string
                        description: '| Option | Description | Area of Usage |

                          | -------|-------------|---------------|

                          | 000 | Success. | General codes |

                          | 001 | Hubject system error. | Internal system codes |

                          | 002 | Hubject database error. |Internal system codes|

                          | 009 |Data transaction error. | Internal system codes|

                          |017 |Unauthorized Access. |Internal system codes |

                          |018 |Inconsistent EvseID. |Internal system codes |

                          |019 |Inconsistent EvcoID. |Internal system codes |

                          |021 |System error. |General codes |

                          |022 |Data error. |General codes |

                          |101 |QR Code Authentication failed – Invalid Credentials. |Authentication codes
                          |

                          |102 |RFID Authentication failed – invalid UID. |Authentication codes |

                          |103 |RFID Authentication failed – card not readable. |Authentication codes
                          |

                          |105 |PLC Authentication failed - invalid EvcoID. |Authentication codes |

                          |106 |No positive authentication response. |Authentication codes / Internal
                          system codes |

                          |110 |QR Code App Authentication failed – time out error. |Authentication codes
                          |

                          |120 |PLC (ISO/ IEC 15118) Authentication failed – invalid underlying EvcoID.
                          |Authentication codes |

                          |121 |PLC (ISO/ IEC 15118) Authentication failed – invalid certificate. |Authentication
                          codes |

                          |122 |PLC (ISO/ IEC 15118) Authentication failed – time out error. |Authentication
                          codes |

                          |200 |EvcoID locked. |Authentication codes |

                          |210 |No valid contract. |Session codes |

                          |300 |Partner not found. |Session codes |

                          |310 |Partner did not respond. |Session codes |

                          |320 |Service not available. |Session codes |

                          |400 |Session is invalid. |Session codes |

                          |501 |Communication to EVSE failed. |EVSE codes |

