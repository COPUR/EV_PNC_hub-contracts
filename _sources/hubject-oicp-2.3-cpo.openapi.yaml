  /evsepush/v23/operators/{operatorID}/data-records:
    post:
      summary: eRoamingPushEvseData_V2.3
      operationId: eRoamingPushEvseData_V2.3
      description: "__Note:__\n  * To `SEND`\n  * Implementation: `MANDATORY`\n\n![Push evse data diagram](images/pushevsedata.png)\n\
        \nWhen a CPO sends an eRoamingPushEvseData request, Hubject checks whether there is a valid contract\
        \ between Hubject and the CPO for the service type (Hubject must be the subscriber). If so, the\
        \ operation allows uploading EVSE data to Hubject.\nFurthermore, it is possible to update or delete\
        \ EVSE data that has been pushed with an earlier operation request.\nHow Hubject handles the transferred\
        \ data `MUST` be defined in the request field \"ActionType\", which offers four options.\n\nThe\
        \ EvseData that will be inserted or updated `MUST` be provided in the OperatorEvseData field,\
        \ which consists of EvseDataRecord structures. Hubject keeps a history of all updated and changed\
        \ data records. Every successful push operation – irrespective of the performed action – leads\
        \ to a new version of currently valid data records. Furthermore, every operation is logged with\
        \ the current timestamp. Thus, Hubject can reconstruct the status of EvseData for every point\
        \ in time in the past.\n\nEVSE consistency:\n\nEvseIDs contain the ID of the corresponding CPO\
        \ (With every data upload operation Hubject checks whether the given CPO’s OperatorID or Sub-OperatorIDs\
        \ if necessary) matches every given EvseID. If not, Hubject refuses the data upload and responds\
        \ with the status code 018.\n\nNote:\n* The eRoamingPushEvseData operation `MUST` always be used\
        \ sequentially as described in Data Push Operations.\n"
      tags:
      - eRoamingEvseData
      parameters:
      - name: operatorID
        in: path
        required: true
        description: The id of the operator
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ActionType
              - OperatorEvseData
              properties:
                ActionType:
                  type: string
                  enum:
                  - fullLoad
                  - update
                  - insert
                  - delete
                  description: Describes the action that has to be performed by Hubject with the provided
                    data.
                OperatorEvseData:
                  type: object
                  required:
                  - OperatorID
                  - OperatorName
                  - EvseDataRecord
                  properties:
                    OperatorID:
                      type: string
                      pattern: ^(([A-Za-z]{2}\*?[A-Za-z0-9]{3})|(\+?[0-9]{1,3}\*[0-9]{3}))$
                      description: 'A string that MUST be valid with respect to the following regular
                        expression: ISO | DIN


                        ^(([A-Za-z]{2}\*?[A-Za-z0-9]{3})|(\+?[0-9]{1,3}\*[0-9]{3}))$

                        The expression validates the string as OperatorID including the preceding country
                        code, which is part of EvseID. It supports both definitions DIN SPEC 91286:2011-11
                        as well as ISO 15118. In case the OperatorID is provided corresponding to ISO,
                        the country code MUST be provided as Alpha-2-Code (DIN EN ISO-3166-1) and the
                        separator character “*” is optional.


                        In case the OperatorID is provided corresponding to DIN, the country code MUST
                        be provided according to the international telecommunication numbering plan (ITU-T
                        E.164:11/2010) and the separator character “*” is mandatory.


                        Examples ISO: “DE*A36”, “DEA36”


                        Example DIN: “+49*536”

                        '
                      example: +49*536
                    OperatorName:
                      type: string
                      maximum: 100
                      description: Free text for operator
                    EvseDataRecord:
                      type: array
                      description: EVSE entries
                      items:
                        type: object
                        required:
                        - EvseID
                        - ChargingStationNames
                        - Address
                        - GeoCoordinates
                        - Plugs
                        - ChargingFacilities
                        - RenewableEnergy
                        - CalibrationLawDataAvailability
                        - AuthenticationModes
                        - PaymentOptions
                        - ValueAddedServices
                        - Accessibility
                        - HotlinePhoneNumber
                        - IsOpen24Hours
                        - IsHubjectCompatible
                        - DynamicInfoAvailable
                        properties:
                          deltaType:
                            type: string
                            enum:
                            - update
                            - insert
                            - delete
                            description: In case that the operation “PullEvseData” is performed with the
                              parameter “LastCall”, Hubject assigns this attribute to every response EVSE
                              record in order to return the changes compared to the last call.
                          lastUpdate:
                            type: string
                            format: date-time
                            description: The attribute indicates the date and time of the last update
                              of the record. Hubject assigns this attribute to every response EVSE record.
                          EvseID:
                            type: string
                            pattern: ^(([A-Za-z]{2}\*?[A-Za-z0-9]{3}\*?E[A-Za-z0-9\*]{1,30})|(\+?[0-9]{1,3}\*[0-9]{3}\*[0-9\*]{1,32}))$
                            description: 'The ID that identifies the charging spot.


                              A string that `MUST` be valid with respect to the following regular expression:
                              ISO | DIN.


                              `^(([A-Za-z]{2}\*?[A-Za-z0-9]{3}\*?E[A-Za-z0-9\*]{1,30})|(\+?[0-9]{1,3}\*[0-9]{3}\*[0-9\*]{1,32}))$`

                              The expression validates the string as EvseID. It supports both definitions
                              DIN SPEC 91286:2011-11 as well as ISO 15118-1.


                              In case the EvseID is provided corresponding to ISO, the country code MUST
                              be provided as Alpha-2-Code (DIN EN ISO-3166-1) and the separator character
                              “*” is optional. Furthermore the ID MUST provide an “E” after the OperatorID
                              in order to identify the ID as ISO EvseID without doubt.


                              In case the EvseID is provided corresponding to DIN, the country code MUST
                              be provided according to the international telecommunication numbering plan
                              (ITU-T E.164:11/2010) and the separator character “*” is mandatory.


                              Examples ISO: “DE*AB7*E840*6487”, “DEAB7E8406487”


                              Example DIN: “+49*810*000*438”

                              '
                            example: +49*810*000*438
                          ChargingPoolID:
                            type: string
                            pattern: ([A-Za-z]{2}\*?[A-Za-z0-9]{3}\*?P[A-Za-z0-9\*]{1,30})
                            description: 'VSEs may be grouped by using a charging pool id according to
                              emi³ standard definition. The Evse Pool ID MUST match the following structure
                              (the notation corresponds to the augmented Backus-Naur Form (ABNF) as defined
                              in RFC5234):

                              <Evse Pool ID> = <Country Code> <S> <Spot Operator ID> <S> <ID Type> <Pool
                              ID>


                              with:


                              <Country Code> = 2 ALPHA ; two character country code according to ISO-3166-1
                              (Alpha-2-Code).


                              <Spot Operator ID> = 3 (ALPHA / DIGIT); three alphanumeric characters.


                              <ID Type> = “P”; one character “P” indicating that this ID represents a
                              “Pool”.


                              <Pool Instance> = (ALPHA / DIGIT) 1 * 30 ( 1*(ALPHA / DIGIT) [/ <S>] );
                              between 1 and 31sequence of alphanumeric characters, including additional
                              optional separators. Starts with alphanumeric character referring to a specific
                              Pool in EVSE Operator data system.


                              ALPHA = %x41-5A / %x61-7A; according to RFC 5234 (7-Bit ASCII).


                              DIGIT = %x30-39; according to RFC 5234 (7-Bit ASCII).


                              <S> = *1 ( “*” ); optional separator


                              An example for a valid Evse Pool ID is “IT*123*P456*AB789” with :


                              “IT” indicating Italy,


                              “123” representing a particular Spot Operator,


                              “P” indicating the Pool, and


                              “456*AB789” representing one of its POOL.


                              Note


                              In contrast to the eMA ID, no check digit is specified for the Evse Pool
                              ID in this document. Alpha characters SHALL be interpreted case insensitively.
                              emi³ strongly recommends that implementations SHOULD - use the separator
                              between Country Code and Spot Operator ID - use the separator between Spot
                              Operator ID and ID type

                              This leads to the following regular expression:


                              `([A-Za-z]{2}\*?[A-Za-z0-9]{3}\*?P[A-Za-z0-9\*]{1,30})`


                              This regular expression is similar to that of the ISO EvseIDType but E is
                              replaced with P to indicate a pool.

                              '
                            example: IT*123*P456*AB789
