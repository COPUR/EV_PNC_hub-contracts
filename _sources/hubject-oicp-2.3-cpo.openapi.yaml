      description: "__Note:__\n  * To `RECEIVE`\n  * Implementation: `OPTIONAL`\n\n![Reservation stop\
        \ diagram](images/reservationstop.png)\n\neRoamingAuthorizeRemoteReservationStop basically works\
        \ in the same way as eRoamingAuthorizeRemoteReservationStart.\nThe only difference is that this\
        \ request is sent in order to end the reservation of a charging spot.\nThe request `MUST` contain\
        \ the SessionID that was created by Hubject after the initial eRoamingAuthorizeRemoteReservationStart\
        \ request.\nAfter the eRoamingAuthorizeRemoteReservationStop the CPO `MUST` provide a CDR.\n"
