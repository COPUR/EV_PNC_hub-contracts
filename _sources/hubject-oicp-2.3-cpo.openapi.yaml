  /evsepush/v21/operators/{operatorID}/status-records:
    post:
      summary: eRoamingPushEvseStatus_V2.1
      operationId: eRoamingPushEvseStatus_V2.1
      description: "__Note:__\n  * To `SEND`\n  * Implementation: `Mandatory`\n\n![Push EVSE status](images/pushevsestatus.png)\n\
        \nWhen a CPO sends an eRoamingPushEvseStatus request, Hubject checks whether there is a valid\
        \ contract between Hubject and the CPO for the service type (Hubject must be the subscriber).\
        \ If so, the operation allows uploading EVSE status data to Hubject. Furthermore, it is possible\
        \ to update EVSE status data that has been pushed with an earlier operation request.\n\nThe way\
        \ how Hubject handles the transferred data `MUST` be defined in the request field \"ActionType2,\
        \ which offers four options. This option works in the same way as the eRoamingAuthenticationData\
        \ service. The EVSE status data that will be inserted or updated MUST be provided with the field\
        \ “OperatorEvseStatus”, which consists of “EvseStatusRecord” structures. Hubject keeps a history\
        \ of all updated and changed data records. Every successful push operation – irrespective of the\
        \ performed action – leads to a new version of currently valid data records. Furthermore, every\
        \ operation is logged with the current timestamp. Thus, Hubject can reconstruct the status of\
        \ EVSE status data for every point in time in the past.\n\nNote:\n\nThe eRoamingPushEvseStatus\
        \ operation `MUST` always be used sequentiallyas described in Data Push Operations\n\nBest Practices:\n\
        \nPlease try to avoid race conditions by sending multiple status simultaneously. Status should\
        \ be sent one by one.\n"
      tags:
      - eRoamingEvseStatus
      parameters:
      - name: operatorID
        in: path
        required: true
        description: The id of the operator
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ActionType
              - OperatorEvseStatus
              description: eRoamingPushEvseStatus is a message that is sent in order to upload EVSE status
                data to Hubject.
              properties:
                ActionType:
                  type: string
                  enum:
                  - fullLoad
                  - update
                  - insert
                  - delete
                  description: Describes the action that has to be performed by Hubject with the provided
                    data.
                OperatorEvseStatus:
                  type: object
                  required:
                  - OperatorID
                  - EvseStatusRecord
                  description: Indicates the Eves status
                  properties:
                    OperatorID:
                      type: string
                      pattern: ^(([A-Za-z]{2}\*?[A-Za-z0-9]{3})|(\+?[0-9]{1,3}\*[0-9]{3}))$
                      description: 'A string that MUST be valid with respect to the following regular
                        expression: ISO | DIN


                        ^(([A-Za-z]{2}\*?[A-Za-z0-9]{3})|(\+?[0-9]{1,3}\*[0-9]{3}))$

                        The expression validates the string as OperatorID including the preceding country
                        code, which is part of EvseID. It supports both definitions DIN SPEC 91286:2011-11
                        as well as ISO 15118. In case the OperatorID is provided corresponding to ISO,
                        the country code MUST be provided as Alpha-2-Code (DIN EN ISO-3166-1) and the
                        separator character “*” is optional.


                        In case the OperatorID is provided corresponding to DIN, the country code MUST
                        be provided according to the international telecommunication numbering plan (ITU-T
                        E.164:11/2010) and the separator character “*” is mandatory.


                        Examples ISO: “DE*A36”, “DEA36”


                        Example DIN: “+49*536”

                        '
                      example: +49*536
                    OperatorName:
                      type: string
                      description: Free text for operator
                      maximum: 100
                    EvseStatusRecord:
                      type: array
                      description: EvseStatus list
                      items:
                        type: object
                        required:
                        - EvseID
                        - EvseStatus
                        properties:
                          EvseID:
                            type: string
                            pattern: ^(([A-Za-z]{2}\*?[A-Za-z0-9]{3}\*?E[A-Za-z0-9\*]{1,30})|(\+?[0-9]{1,3}\*[0-9]{3}\*[0-9\*]{1,32}))$
                            description: 'The ID that identifies the charging spot.


                              A string that `MUST` be valid with respect to the following regular expression:
                              ISO | DIN.


                              `^(([A-Za-z]{2}\*?[A-Za-z0-9]{3}\*?E[A-Za-z0-9\*]{1,30})|(\+?[0-9]{1,3}\*[0-9]{3}\*[0-9\*]{1,32}))$`

                              The expression validates the string as EvseID. It supports both definitions
                              DIN SPEC 91286:2011-11 as well as ISO 15118-1.


                              In case the EvseID is provided corresponding to ISO, the country code MUST
                              be provided as Alpha-2-Code (DIN EN ISO-3166-1) and the separator character
                              “*” is optional. Furthermore the ID MUST provide an “E” after the OperatorID
                              in order to identify the ID as ISO EvseID without doubt.


                              In case the EvseID is provided corresponding to DIN, the country code MUST
                              be provided according to the international telecommunication numbering plan
                              (ITU-T E.164:11/2010) and the separator character “*” is mandatory.


                              Examples ISO: “DE*AB7*E840*6487”, “DEAB7E8406487”


                              Example DIN: “+49*810*000*438”

                              '
                            example: +49*810*000*438
                          EvseStatus:
                            type: string
                            enum:
                            - Available
                            - Reserved
                            - Occupied
                            - OutOfService
                            - EvseNotFound
                            - Unknown
                            description: "| Option | Description |                \n| ------ | -----------\
                              \ |\n| Available | Charging Spot is available for charging. |\n| Reserved\
                              \ | Charging Spot is reserved and not available for charging. |\n| Occupied\
                              \ | Charging Spot is busy. |\n| OutOfService | Charging Spot is out of service\
                              \ and not available for charging. |\n| EvseNotFound | The requested EvseID\
                              \ and EVSE status does not exist within the Hubject database. |\n| Unknown\
                              \ | No status information available. |\n"
              example:
                ActionType: fullLoad
                OperatorEvseStatus:
                  OperatorID: DE*ABC
                  OperatorName: ABC technologies
                  EvseStatusRecord:
                  - EvseID: DE*XYZ*ETEST1
                    EvseStatus: Available
