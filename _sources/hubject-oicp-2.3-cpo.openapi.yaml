  /notificationmgmt/v11/charging-notifications:
    post:
      summary: eRoamingChargingNotifications_V1.1
      operationId: eRoamingChargingNotifications_V1.1
      description: "__Note:__\n  * To `SEND`\n  * Implementation: `OPTIONAL`\n\n__Functional Description:__\n\
        \n![Charging notifications diagram](images/chargingnotifications.png)\nThe ChargingNotification\
        \ feature enables CPOs to notify EMPs about the end of charge\n\nThe ChargingNotification feature\
        \ basically increases the transparency between CPO - EMP - End Consumer to the level of each charging\
        \ session.\n\nThis feature enables CPO to send various notifications during a single Charging\
        \ Session. These notifications give the details like\n\n1. When the charging session has started.\
        \ The CPO can send ChargingNotification of type “Start” to Hubject containing information like\
        \ ChargingStart, MeterStartValue, EVSEID etc.\n\n2. Consumed Energy values during the charging\
        \ process or duration of successful charging process that has lapsed. The CPO can send ChargingNotification\
        \ of type “Progress” to Hubject containing information like ChargingStart, EventOccurred, ChargingDuration,\
        \ ConsumedEnergyProgress, EVSEID etc. The frequency between two progress notifications for one\
        \ charging session should be at least 5 minutes.\n\n3. When the charging session has ended (because\
        \ no energy is transmitted anymore). The CPO can send a ChargingNotification of type “End” to\
        \ Hubject containing information such as ChargingEnd, ConsumedEnergy, EVSEID etc.\n\n4. Error\
        \ occurred before charging starts or during charging process or abrupt changing end. The CPO can\
        \ send a ChargingNotification of type “Error” to Hubject containing information such as ErrorClass,\
        \ ErrorAdditionalInfo, EVSEID etc.\n\nHubject will forward Start, Progress, End and Error notification\
        \ requests to the EMP. The EMP responds with an eRoamingAcknowledgement. This acknowledgement\
        \ is then being forwarded to the CPO.\n\nThis feature should cover all the notifications that\
        \ could happen between Session Start and Session End in future. Each bit of information increases\
        \ transparency to the customer of EMP.\n"
      tags:
      - eRoamingChargingNotifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                description: 'A customer of EMP Authorizes the charging session at particular charging
                  station (via any means for eg REFID card, Mobile etc). The charging session is authorized
                  by Hubject / CPO system. The authorization of charging process and plugging the cable
                  in EV does not guarantee that energy flow into the Vehicle is initiated. It is really
                  important for for EMP and its end consumer to know if the charging has started.


                  The CPO’s backend system MAY send a ChargingNotification of type “Start” after the CPO
                  considers the charging of an EV is started (since energy flow have started) in order
                  to inform the EMP that the actual charging (the energy flow) of the vehicle has started.


                  The ChargingNotification of type “Start” is a message that contains information about
                  the charging start of a session (e.g. ChargingStart).

                  '
                required:
                - Type
                - SessionID
                - EvseID
                - ChargingStart
                - OperatorID
                properties:
                  Type:
                    type: string
                    description: The type of ChargingNotification
                    enum:
                    - Start
                    - Progress
                    - End
                    - Error
                    example: Start
                  SessionID:
                    type: string
                    pattern: ^[A-Za-z0-9]{8}(-[A-Za-z0-9]{4}){3}-[A-Za-z0-9]{12}$
                    description: 'The Hubject SessionID that identifies the process


                      A string that `MUST` be valid with respect to the following regular expression:


                      `^[A-Za-z0-9]{8}(-[A-Za-z0-9]{4}){3}-[A-Za-z0-9]{12}$`


                      The expression validates the string as a GUID.


                      Example: “b2688855-7f00-0002-6d8e-48d883f6abb6”

                      '
                    example: b2688855-7f00-0002-6d8e-48d883f6abb6
                  CPOPartnerSessionID:
                    type: string
                    description: 'Optional field containing the session ID assigned by the CPO to the
                      related operation.


                      Partner systems can use this field to link their own session handling to HBS processes.

                      '
                    maximum: 250
                  EMPPartnerSessionID:
                    type: string
                    description: 'Optional field containing the session ID assigned by an EMP to the related
                      operation.


                      Partner systems can use this field to link their own session handling to HBS processes.

                      '
                    maximum: 250
                  Identification:
                    type: object
                    description: 'Authentication data


                      1. The option RFIDIdentification `MUST` not be used in the eRoamingAuthorization
                      process. For RFID Authorization, only the option RFIDMifareFamilyIdentification
                      `SHOULD` be used in the respective eRoamingAuthorization messages.

                      2. For the Remote Authorization process, only the option RemoteIdentification MUST
                      be used in the respective messages.

                      '
                    properties:
                      RFIDMifareFamilyIdentification:
                        type: object
                        description: 'Authentication data details. The data structure differs depending
                          on the authentication technology

                          '
                        properties:
                          UID:
                            type: string
                            pattern: ^([0-9A-F]{8,8}|[0-9A-F]{14,14}|[0-9A-F]{20,20})$
                            description: 'Authentication data details. The data structure differs depending
                              on the authentication technology


                              The expression validates the string as a unique RFID with a length of 8,
                              14 or 20 characters.


                              Examples: “7568290FFF765F”

                              '
                            example: 7568290FFF765F
                        required:
                        - UID
                        example:
                          UID: 7568290FFF765F
                      RFIDIdentification:
                        type: object
                        description: 'Authentication data details. The data structure differs depending
                          on the authentication technology

                          '
                        properties:
                          UID:
                            type: string
                            pattern: ^([0-9A-F]{8,8}|[0-9A-F]{14,14}|[0-9A-F]{20,20})$
                            description: 'Authentication data details. The data structure differs depending
                              on the authentication technology


                              The expression validates the string as a unique RFID with a length of 8,
                              14 or 20 characters.


                              Examples: “7568290FFF765F”

                              '
                            example: 7568290FFF765F
                          EvcoID:
                            type: string
                            pattern: ^(([A-Za-z]{2}\-?[A-Za-z0-9]{3}\-?C[A-Za-z0-9]{8}\-?[\d|A-Za-z])|([A-Za-z]{2}[\*|\-]?[A-Za-z0-9]{3}[\*|\-]?[A-Za-z0-9]{6}[\*|\-]?[\d|X]))$
                            description: 'A string that `MUST` be valid with respect to the following
                              regular expression: ISO | DIN.


                              ^(([A-Za-z]{2}\-?[A-Za-z0-9]{3}\-?C[A-Za-z0-9]{8}\-?[\d|A-Za-z])|([A-Za-z]{2}[\*|\-]?[A-Za-z0-9]{3}[\*|\-]?[A-Za-z0-9]{6}[\*|\-]?[\d|X]))$

                              The expression validates the string as EvcoID. It supports both definitions
                              DIN SPEC 91286:2011-11 as well as ISO 15118-1.


                              In case the EvcoID is provided corresponding to ISO, the instance part MUST
                              be eight characters long and MUST be provided with a prepended “C”. The
                              optional separating character MUST be “-“.


                              In case the EvcoID is provided corresponding to DIN, the instance part MUST
                              be six characters long. The optional separating character can either be
                              “*” or “-“.


                              Examples ISO: “DE-8EO-CAet5e4XY-3”, “DE8EOCAet5e43X1”


                              Examples DIN: “DE*8EO*Aet5e4*3”, “DE-8EO-Aet5e4-3”, “DE8EOAet5e43”

                              '
                            example: DE*8EO*Aet5e4*3
                          RFID:
                            type: string
                            description: 'Defined RFID Type

                              '
                            enum:
                            - mifareCls
                            - mifareDes
                            - calypso
                            - nfc
                            - mifareFamily
                          PrintedNumber:
                            type: string
                            maximum: 150
                            description: A number printed on a customer’s card for manual authorization
                              (e.q. via a call center)
                          ExpiryDate:
                            type: string
                            description: Until when this card is valid. Should not be set if card does
                              not have an expiration
                        required:
                        - UID
                        - RFID
                        example:
                          UID: 7568290FFF765F
                          RFID: mifareCls
                      QRCodeIdentification:
                        type: object
                        required:
                        - EvcoID
                        properties:
                          EvcoID:
                            type: string
                            pattern: ^(([A-Za-z]{2}\-?[A-Za-z0-9]{3}\-?C[A-Za-z0-9]{8}\-?[\d|A-Za-z])|([A-Za-z]{2}[\*|\-]?[A-Za-z0-9]{3}[\*|\-]?[A-Za-z0-9]{6}[\*|\-]?[\d|X]))$
                            description: 'A string that `MUST` be valid with respect to the following
                              regular expression: ISO | DIN.


                              ^(([A-Za-z]{2}\-?[A-Za-z0-9]{3}\-?C[A-Za-z0-9]{8}\-?[\d|A-Za-z])|([A-Za-z]{2}[\*|\-]?[A-Za-z0-9]{3}[\*|\-]?[A-Za-z0-9]{6}[\*|\-]?[\d|X]))$

                              The expression validates the string as EvcoID. It supports both definitions
                              DIN SPEC 91286:2011-11 as well as ISO 15118-1.


                              In case the EvcoID is provided corresponding to ISO, the instance part MUST
                              be eight characters long and MUST be provided with a prepended “C”. The
                              optional separating character MUST be “-“.


                              In case the EvcoID is provided corresponding to DIN, the instance part MUST
                              be six characters long. The optional separating character can either be
                              “*” or “-“.


                              Examples ISO: “DE-8EO-CAet5e4XY-3”, “DE8EOCAet5e43X1”


                              Examples DIN: “DE*8EO*Aet5e4*3”, “DE-8EO-Aet5e4-3”, “DE8EOAet5e43”

                              '
                            example: DE*8EO*Aet5e4*3
                          HashedPIN:
                            type: object
                            required:
                            - Value
                            - Function
                            properties:
                              Value:
                                type: string
                                pattern: ^[0-9A-Za-z\\.+/=\\$]{10,100}$
                                description: 'Hash value created by partner


                                  The expression validates the string as a hash function result value
                                  with a length between 10 and 100 characters


                                  Example: “a5ghdhf73h”

                                  '
                                example: a5ghdhf73h
                              Function:
                                type: string
                                enum:
                                - Bcrypt
                                description: Function that was used to generate the hash value.
                                example: Bcrypt
                              LegacyHashData:
                                type: object
                                required:
                                - Function
                                properties:
                                  Function:
                                    type: string
                                    enum:
                                    - MD5
                                    - SHA-1
                                    description: Function used for hashing of the PIN at the partner.
                                    example: SHA-1
                                  Salt:
                                    type: string
                                    minimum: 0
                                    maximum: 100
                                    description: The salt value used by the partner for hashing the PIN.
                                    example: example-salt
                                  Value:
                                    type: string
                                    minimum: 0
                                    maximum: 20
                                    description: PIN hash at the partner.
                                    example: a5ghdhf73h
                          PIN:
                            type: string
                      PlugAndChargeIdentification:
                        type: object
                        description: 'Authentication required for Plug&Charge (EMAID/EVCOID)

                          '
                        properties:
                          EvcoID:
                            type: string
                            pattern: ^(([A-Za-z]{2}\-?[A-Za-z0-9]{3}\-?C[A-Za-z0-9]{8}\-?[\d|A-Za-z])|([A-Za-z]{2}[\*|\-]?[A-Za-z0-9]{3}[\*|\-]?[A-Za-z0-9]{6}[\*|\-]?[\d|X]))$
                            description: 'A string that `MUST` be valid with respect to the following
                              regular expression: ISO | DIN.


                              ^(([A-Za-z]{2}\-?[A-Za-z0-9]{3}\-?C[A-Za-z0-9]{8}\-?[\d|A-Za-z])|([A-Za-z]{2}[\*|\-]?[A-Za-z0-9]{3}[\*|\-]?[A-Za-z0-9]{6}[\*|\-]?[\d|X]))$

                              The expression validates the string as EvcoID. It supports both definitions
                              DIN SPEC 91286:2011-11 as well as ISO 15118-1.


                              In case the EvcoID is provided corresponding to ISO, the instance part MUST
                              be eight characters long and MUST be provided with a prepended “C”. The
                              optional separating character MUST be “-“.


                              In case the EvcoID is provided corresponding to DIN, the instance part MUST
                              be six characters long. The optional separating character can either be
                              “*” or “-“.


                              Examples ISO: “DE-8EO-CAet5e4XY-3”, “DE8EOCAet5e43X1”


                              Examples DIN: “DE*8EO*Aet5e4*3”, “DE-8EO-Aet5e4-3”, “DE8EOAet5e43”

                              '
                            example: DE*8EO*Aet5e4*3
                        required:
                        - EvcoID
                        example:
                          EvcoID: DE*8EO*Aet5e4*3
                      RemoteIdentification:
                        type: object
                        description: 'Authentication data details. The data structure differs depending
                          on the authentication technology

                          '
                        properties:
                          EvcoID:
                            type: string
                            pattern: ^(([A-Za-z]{2}\-?[A-Za-z0-9]{3}\-?C[A-Za-z0-9]{8}\-?[\d|A-Za-z])|([A-Za-z]{2}[\*|\-]?[A-Za-z0-9]{3}[\*|\-]?[A-Za-z0-9]{6}[\*|\-]?[\d|X]))$
                            description: 'A string that `MUST` be valid with respect to the following
                              regular expression: ISO | DIN.


                              ^(([A-Za-z]{2}\-?[A-Za-z0-9]{3}\-?C[A-Za-z0-9]{8}\-?[\d|A-Za-z])|([A-Za-z]{2}[\*|\-]?[A-Za-z0-9]{3}[\*|\-]?[A-Za-z0-9]{6}[\*|\-]?[\d|X]))$

                              The expression validates the string as EvcoID. It supports both definitions
                              DIN SPEC 91286:2011-11 as well as ISO 15118-1.


                              In case the EvcoID is provided corresponding to ISO, the instance part MUST
                              be eight characters long and MUST be provided with a prepended “C”. The
                              optional separating character MUST be “-“.


                              In case the EvcoID is provided corresponding to DIN, the instance part MUST
                              be six characters long. The optional separating character can either be
                              “*” or “-“.


                              Examples ISO: “DE-8EO-CAet5e4XY-3”, “DE8EOCAet5e43X1”


                              Examples DIN: “DE*8EO*Aet5e4*3”, “DE-8EO-Aet5e4-3”, “DE8EOAet5e43”

                              '
                            example: DE*8EO*Aet5e4*3
                        required:
                        - EvcoID
                        example:
                          EvcoID: DE*8EO*Aet5e4*3
                  EvseID:
                    type: string
                    pattern: ^(([A-Za-z]{2}\*?[A-Za-z0-9]{3}\*?E[A-Za-z0-9\*]{1,30})|(\+?[0-9]{1,3}\*[0-9]{3}\*[0-9\*]{1,32}))$
                    description: 'The ID that identifies the charging spot.


                      A string that `MUST` be valid with respect to the following regular expression:
                      ISO | DIN.


                      `^(([A-Za-z]{2}\*?[A-Za-z0-9]{3}\*?E[A-Za-z0-9\*]{1,30})|(\+?[0-9]{1,3}\*[0-9]{3}\*[0-9\*]{1,32}))$`

                      The expression validates the string as EvseID. It supports both definitions DIN
                      SPEC 91286:2011-11 as well as ISO 15118-1.


                      In case the EvseID is provided corresponding to ISO, the country code MUST be provided
                      as Alpha-2-Code (DIN EN ISO-3166-1) and the separator character “*” is optional.
                      Furthermore the ID MUST provide an “E” after the OperatorID in order to identify
                      the ID as ISO EvseID without doubt.


                      In case the EvseID is provided corresponding to DIN, the country code MUST be provided
                      according to the international telecommunication numbering plan (ITU-T E.164:11/2010)
                      and the separator character “*” is mandatory.


                      Examples ISO: “DE*AB7*E840*6487”, “DEAB7E8406487”


                      Example DIN: “+49*810*000*438”

                      '
                    example: +49*810*000*438
                  ChargingStart:
                    type: string
                    format: date-time
                    description: The date and time at which the charging process started.
                  SessionStart:
                    type: string
                    format: date-time
                    description: The date and time at which the session started, e.g. swipe of RFID or
                      cable connected.
                  MeterValueStart:
                    type: number
                    description: The starting meter value in kWh.
                  OperatorID:
                    type: string
                    pattern: ^(([A-Za-z]{2}\*?[A-Za-z0-9]{3})|(\+?[0-9]{1,3}\*[0-9]{3}))$
                    description: 'A string that MUST be valid with respect to the following regular expression:
                      ISO | DIN


                      ^(([A-Za-z]{2}\*?[A-Za-z0-9]{3})|(\+?[0-9]{1,3}\*[0-9]{3}))$

                      The expression validates the string as OperatorID including the preceding country
                      code, which is part of EvseID. It supports both definitions DIN SPEC 91286:2011-11
                      as well as ISO 15118. In case the OperatorID is provided corresponding to ISO, the
                      country code MUST be provided as Alpha-2-Code (DIN EN ISO-3166-1) and the separator
                      character “*” is optional.


                      In case the OperatorID is provided corresponding to DIN, the country code MUST be
                      provided according to the international telecommunication numbering plan (ITU-T
                      E.164:11/2010) and the separator character “*” is mandatory.


                      Examples ISO: “DE*A36”, “DEA36”


                      Example DIN: “+49*536”

                      '
                    example: +49*536
                  PartnerProductID:
                    type: string
                    description: 'The ProductIDType defines some standard values (see below). The type
                      however also supports custom ProductIDs that can be specified by partners (as a
                      string of 50 characters maximum length).

                      | Option | Description |

                      |--------|-------------|

                      | Standard Price | Standard Price |

                      | AC1 | Product for AC 1 Phase charging |

                      | AC3 | Product for AC 3 Phase charging |

                      | DC | Product for DC charging |

                      | CustomProductID | There is no option “CustomProductID”, this sample option is
                      meant to indicates that custom product ID specifications by partners (as a string
                      of 50 characters maximum length) are allowed as well.|

                      '
                    example: AC1
                    maximum: 50
                example:
                  Type: Start
                  CPOPartnerSessionID: 1234XYZ
                  EMPPartnerSessionID: 2345ABC
                  ChargingStart: '2020-09-23T14:17:53.038Z'
                  EvseID: DE*XYZ*ETEST1
                  Identification:
                    RFIDMifareFamilyIdentification:
                      UID: 1234ABCD
                  MeterValueStart: 0
                  PartnerProductID: AC 1
                  SessionID: f98efba4-02d8-4fa0-b810-9a9d50d2c527
                  SessionStart: '2020-09-23T14:17:53.038Z'
                  OperatorID: DE*ABC
              - type: object
                description: 'A customer of EMP has started the charging session. Just like as that of
                  regular gasoline stations customer would like to know either how much charging Duration
                  have passed or how much energy is consumed by the EV so far. This information will help
