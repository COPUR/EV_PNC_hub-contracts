  /dynamicpricing/v10/operators/{operatorID}/pricing-products:
    post:
      summary: eRoamingPushPricingProductData_V1.0
      operationId: eRoamingPushPricingProductData_V1.0
      description: "__Note:__\n  * To `SEND`\n  * Implementation: `OPTIONAL`\n\n  When a CPO sends an\
        \ eRoamingPushPricingProductData request, Hubject checks whether there is a valid flexible/dynamic\
        \ pricing service offer (for the service type Authorization) created by the CPO. If so, the operation\
        \ allows the upload of pricing product data to Hubject. In addition, it is also possible to update\
        \ or delete pricing data previously pushed with an upload operation request. How the transferred\
        \ data is to be processed `MUST` be defined in the “ActionType” field of the request. Four processing\
        \ options (i.e. Action Types) exist, details of which can be seen in eRoamingPushPricingProductData\
        \ message\n\n  The pricing product data to be processed `MUST` be provided in the “PricingProductData”\
        \ field, which consists of “PricingProductDataRecord” structures. Hubject keeps a history of all\
        \ updated and changed data records. Every successful push operation – irrespective of the performed\
        \ action – leads to a new version of currently valid data records. Furthermore, every operation\
        \ is logged with the current timestamp. Thus, Hubject can reconstruct the status of pricing data\
        \ for every point in time in the past.\n"
      tags:
      - eRoamingDynamicPricing
      parameters:
      - name: operatorID
        in: path
        required: true
        description: The id of the operator
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: eRoamingPushPricingProductData is a message that is sent in order to upload
                data pertaining to a CPO’s pricing products (i.e. tarrifs) to the Hubject system.
              required:
              - ActionType
              - PricingProductData
              properties:
                ActionType:
                  type: string
                  enum:
                  - fullLoad
                  - update
                  - insert
                  - delete
                  description: Describes the action that has to be performed by Hubject with the provided
                    data.
                PricingProductData:
                  type: object
                  required:
                  - OperatorID
                  - ProviderID
                  - PricingDefaultPrice
                  - PricingDefaultPriceCurrency
                  - PricingDefaultReferenceUnit
                  - PricingProductDataRecords
                  description: Details of pricing products offered by a particular operator for a specific
                    provider
                  properties:
                    OperatorID:
                      type: string
                      pattern: ^(([A-Za-z]{2}\*?[A-Za-z0-9]{3})|(\+?[0-9]{1,3}\*[0-9]{3}))$
                      description: 'A string that MUST be valid with respect to the following regular
                        expression: ISO | DIN


                        ^(([A-Za-z]{2}\*?[A-Za-z0-9]{3})|(\+?[0-9]{1,3}\*[0-9]{3}))$

                        The expression validates the string as OperatorID including the preceding country
                        code, which is part of EvseID. It supports both definitions DIN SPEC 91286:2011-11
                        as well as ISO 15118. In case the OperatorID is provided corresponding to ISO,
                        the country code MUST be provided as Alpha-2-Code (DIN EN ISO-3166-1) and the
                        separator character “*” is optional.


                        In case the OperatorID is provided corresponding to DIN, the country code MUST
                        be provided according to the international telecommunication numbering plan (ITU-T
                        E.164:11/2010) and the separator character “*” is mandatory.


                        Examples ISO: “DE*A36”, “DEA36”


                        Example DIN: “+49*536”

                        '
                      example: +49*536
                    OperatorName:
                      type: string
                      description: Free text for operator
                      maximum: 100
                    ProviderID:
                      type: string
                      pattern: ^([A-Za-z]{2}\-?[A-Za-z0-9]{3}|[A-Za-z]{2}[\*|-]?[A-Za-z0-9]{3})|\*$
                      description: "The ProviderID is defined by Hubject and is used to identify the EMP\n\
                        \nA string that `MUST` be valid with respect to the following regular expression:\
                        \ ISO | DIN\n\n`^([A-Za-z]{2}\\-?[A-Za-z0-9]{3}|[A-Za-z]{2}[\\*|-]?[A-Za-z0-9]{3})$`\n\
                        \nThe expression validates the string as ProviderID including the preceding country\
                        \ code, which is part of EvcoID. It supports both definitions DIN SPEC 91286:2011-11\
                        \ as well as ISO 15118-1.\n\nIn case the ProviderID is provided corresponding\
                        \ to ISO, the country code `MUST` be provided as Alpha-2-Code (DIN EN ISO-3166-1)\
                        \ and the separator character “-” is optional.\n\nExamples ISO: “DE8EO”, “DE-8EO”\n\
                        \nExamples DIN: “DE8EO”, “DE*8EO”, “DE-8EO”\n\n In case the data is to be made\
                        \ available for all EMPs (e.g. for Offer-to-All prices), the asterix character\
                        \ (*) can be set as the value in this field.\n \n"
                      example: DE-8EO
                    PricingDefaultPrice:
                      type: number
                      description: A default price for pricing sessions at undefined EVSEs
                    PricingDefaultPriceCurrency:
                      type: string
                      description: 'The ProductPriceCurrencyType allows for the list of active codes of
                        the official ISO 4217 currency names.


                        For the full list of active codes of the official ISO 4217 currencies, see: [https://www.iso.org/iso-4217-currency-codes.html](https://www.iso.org/iso-4217-currency-codes.html)


                        Examples:


                        | Option | Description |

                        | ------ | ----------- |

                        | EUR | Euro |

                        | CHF | Swiss franc |

                        | CAD | Canadian Dollar |

                        | GBP | Pound sterling

                        '
                      example: EUR
                    PricingDefaultReferenceUnit:
                      type: string
                      description: 'Default Reference Unit in time or kWh


                        | Option | Description |

                        | ------ | ----------- |

                        | HOUR | Defined Reference Unit Type |

                        | KILOWATT_HOUR | Defined Reference Unit Type |

                        | MINUTE | Defined Reference Unit Type |

                        '
                      example: HOUR
                    PricingProductDataRecords:
                      type: array
                      description: A list of pricing products
                      items:
                        type: object
                        required:
                        - ProductID
                        - ReferenceUnit
                        - ProductPriceCurrency
                        - PricePerReferenceUnit
                        - MaximumProductChargingPower
                        - IsValid24hours
                        - ProductAvailabilityTimes
                        properties:
                          ProductID:
                            type: string
                            description: 'The ProductIDType defines some standard values (see below).
                              The type however also supports custom ProductIDs that can be specified by
                              partners (as a string of 50 characters maximum length).

                              | Option | Description |

                              |--------|-------------|

                              | Standard Price | Standard Price |

                              | AC1 | Product for AC 1 Phase charging |

                              | AC3 | Product for AC 3 Phase charging |

                              | DC | Product for DC charging |

                              | CustomProductID | There is no option “CustomProductID”, this sample option
                              is meant to indicates that custom product ID specifications by partners
                              (as a string of 50 characters maximum length) are allowed as well.|

                              '
                            example: AC1
                            maximum: 50
                          ReferenceUnit:
                            type: string
                            description: 'Default Reference Unit in time or kWh


                              | Option | Description |

                              | ------ | ----------- |

                              | HOUR | Defined Reference Unit Type |

                              | KILOWATT_HOUR | Defined Reference Unit Type |

                              | MINUTE | Defined Reference Unit Type |

                              '
                            example: HOUR
                          ProductPriceCurrency:
                            type: string
                            description: 'The ProductPriceCurrencyType allows for the list of active codes
                              of the official ISO 4217 currency names.


                              For the full list of active codes of the official ISO 4217 currencies, see:
                              [https://www.iso.org/iso-4217-currency-codes.html](https://www.iso.org/iso-4217-currency-codes.html)


                              Examples:


                              | Option | Description |

                              | ------ | ----------- |

                              | EUR | Euro |

                              | CHF | Swiss franc |

                              | CAD | Canadian Dollar |

                              | GBP | Pound sterling

                              '
                            example: EUR
                          PricePerReferenceUnit:
                            type: number
                            description: A price per reference unit
                          MaximumProductChargingPower:
                            type: number
                            description: A value in kWh
                          IsValid24hours:
                            type: boolean
                            description: 'Set to TRUE if the respective pricing product is applicable
                              24 hours a day.

                              If FALSE, the respective applicability times `SHOULD` be provided in the
                              field “ProductAvailabilityTimes”.

                              '
                          ProductAvailabilityTimes:
                            type: array
                            description: A list indicating when the pricing product is applicable
                            items:
                              type: object
                              required:
                              - Periods
                              - 'on'
                              properties:
                                Periods:
                                  type: array
                                  items:
                                    type: object
                                    description: 'The starting and end time for pricing product applicability
                                      in the specified period

                                      '
                                    required:
                                    - begin
                                    - end
                                    properties:
                                      begin:
                                        type: string
                                        description: The opening time
                                        pattern: '[0-9]{2}:[0-9]{2}'
                                      end:
                                        type: string
                                        description: The closing time
                                        pattern: '[0-9]{2}:[0-9]{2}'
                                'on':
                                  type: string
                                  enum:
                                  - Everyday
                                  - Workdays
                                  - Weekend
                                  - Monday
                                  - Tuesday
                                  - Wednesday
                                  - Thursday
                                  - Friday
                                  - Saturday
                                  - Sunday
                                  description: Day values to be used in specifying periods on which the
                                    product is available. Workdays = Monday – Friday, Weekend = Saturday
                                    – Sunday
                          AdditionalReferences:
                            type: array
                            description: A list of additional reference units and their respective prices
                            items:
                              type: object
                              required:
                              - AdditionalReference
                              - AdditionalReferenceUnit
                              - PricePerAdditionalReferenceUnit
                              properties:
                                AdditionalReference:
                                  type: string
                                  enum:
                                  - START FEE
                                  - FIXED FEE
                                  - PARKING FEE
                                  - MINIMUM FEE
                                  - MAXIMUM FEE
                                  description: 'Additional pricing components to be considered in addition
                                    to the base pricing


                                    | Option | Description |

                                    | ------ | ----------- |

                                    | START FEE | Can be used in case a fixed fee is charged for the initiation
                                    of the charging session. This is a fee charged on top of the main
                                    base price defined in the field "PricePerReferenceUnit" for any particular
                                    pricing product. |

                                    | FIXED FEE | Can be used if a single price is charged irrespective
                                    of charging duration or energy consumption (for instance if all sessions
                                    are to be charged a single fixed fee). When used, the value set in
                                    the field "PricePerReferenceUnit" for the main base price of respective
                                    pricing product SHOULD be set to zero. |

                                    | PARKING FEE | Can be used in case sessions are to be charged for
                                    both parking and charging. When used, it needs to be specified in
                                    the corresponding service offer on the HBS Portal when parking applies
                                    (e.g. from session start to charging start and charging end to session
                                    end or for the entire session duration, or x-minutes after charging
                                    end, etc) |

                                    | MINIMUM FEE | Can be used in case there is a minimum fee to be paid
                                    for all charging sessions. When used, this implies that the eventual
                                    price to be paid cannot be less than this minimum fee but can however
                                    be a price above/greater than the minimum fee. |

                                    | MAXIMUM FEE | Can be used in case there is a maximum fee to be charged
                                    for all charging sessions. When used, this implies that the eventual
                                    price to be paid cannot be more than this maximum fee but can however
                                    be a price below/lower than the maximum fee. |

                                    '
                                AdditionalReferenceUnit:
                                  type: string
                                  description: 'Default Reference Unit in time or kWh


                                    | Option | Description |

                                    | ------ | ----------- |

                                    | HOUR | Defined Reference Unit Type |

                                    | KILOWATT_HOUR | Defined Reference Unit Type |

                                    | MINUTE | Defined Reference Unit Type |

                                    '
                                  example: HOUR
                                PricePerAdditionalReferenceUnit:
                                  type: number
                                  description: A price in the given currency
              example:
                ActionType: fullLoad
                PricingProductData:
                  OperatorID: DE*ABC
                  OperatorName: ABC technologies
                  PricingDefaultPrice: 0
                  PricingDefaultPriceCurrency: EUR
                  PricingDefaultReferenceUnit: HOUR
                  PricingProductDataRecords:
                  - AdditionalReferences:
                    - AdditionalReference: PARKING FEE
                      AdditionalReferenceUnit: HOUR
                      PricePerAdditionalReferenceUnit: 2
                    IsValid24hours: false
                    MaximumProductChargingPower: 22
                    PricePerReferenceUnit: 1
                    ProductAvailabilityTimes:
                    - Periods:
                      - begin: 09:00
                        end: '18:00'
                      'on': Everyday
                    ProductID: AC 1
                    ProductPriceCurrency: EUR
                    ReferenceUnit: HOUR
                  ProviderID: '*'
      responses:
        '200':
          description: Expected response to a valid request
