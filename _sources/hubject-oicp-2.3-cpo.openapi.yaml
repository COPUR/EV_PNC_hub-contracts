  /charging/v21/providers/{providerID}/authorize-remote/start:
    post:
      summary: eRoamingAuthorizeRemoteStart_v2.1
      operationId: eRoamingAuthorizeRemoteStart_v2.1
      description: "__Note:__\n  * To `RECEIVE`\n  * Implementation: `MANDATORY`\n  * This operation is\
        \ used by EMPs in order to remotely start a charging process\n\nThe service that is offered by\
        \ Hubject in order to allow customers to directly start a charging process via mobile app.\n\n\
        ![Remote start diagram](images/remotestart.png)\n\n\n__Functional Description:__\n\n__Scenario:__\n\
        \nA customer of an EMP wants to charge a vehicle at a charging station of a CPO. The customer\
        \ informs his EMP of his intention, e.g. via mobile phone or smart phone application. The EMP’s\
        \ provider system can then initiate a charging process at the CPO’s charging station by sending\
        \ an eRoamingAuthorizeRemoteStart request to Hubject. The request `MUST` contain the ProviderID\
        \ and the EvseID.\n\nHubject will derive the CPO’s OperatorID from the EvseID.\n\nHubject will\
        \ check whether there is a valid contract between the two partners for the service (EMP must be\
        \ the subscriber). If so, Hubject continues with checking the charging point compatibility. In\
        \ case that the CPO has uploaded at least one charging point data record, Hubject will check whether\
        \ the requested EvseID is among the uploaded data. If not, Hubject will respond with the status\
        \ code 603 “Unknown EvseID”. If yes, Hubject will check whether the charging spot’s property “IsHubjectCompatible”\
        \ is set “true”. If the property is false, Hubject will respond with the status code 604 “EvseID\
        \ is not Hubject compatible”.\n\nIn case that the requested EvseID is compatible or the CPO has\
        \ not uploaded any EVSE records at all, Hubject generates a SessionID for the following process\
        \ and forwards the request (including the SessionID) to the CPO. The CPO `MUST` return an eRoamingAcknowledgement\
        \ message that `MUST` contain the result indicating whether the charging process will be started\
        \ and that `MAY` contain a status code for further information.\n\nIn case that the CPO’s system\
        \ cannot be addressed (e.g. due to technical problems), Hubject will return to the requestor a\
        \ “false” result and a message indicating the connection error.\n\nBest Practices:\n  * Please\
        \ ensure a request run time of under 10 seconds including network roundtrip.\n"
      tags:
      - eRoamingAuthorization
      parameters:
      - name: providerID
        in: path
        required: true
        description: The id of the provider
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - SessionID
              - ProviderID
              - EvseID
              - Identification
              properties:
                SessionID:
                  type: string
                  pattern: ^[A-Za-z0-9]{8}(-[A-Za-z0-9]{4}){3}-[A-Za-z0-9]{12}$
                  description: 'The Hubject SessionID that identifies the process


                    A string that `MUST` be valid with respect to the following regular expression:


                    `^[A-Za-z0-9]{8}(-[A-Za-z0-9]{4}){3}-[A-Za-z0-9]{12}$`


                    The expression validates the string as a GUID.


                    Example: “b2688855-7f00-0002-6d8e-48d883f6abb6”

                    '
                  example: b2688855-7f00-0002-6d8e-48d883f6abb6
                CPOPartnerSessionID:
                  type: string
                  maximum: 250
                  description: Optional field containing the session id assigned by the CPO to the related
                    operation.
                EMPPartnerSessionID:
                  type: string
                  maximum: 250
                  description: Optional field containing the session id assigned by an EMP to the related
                    operation.
                ProviderID:
                  type: string
                  pattern: ^([A-Za-z]{2}\-?[A-Za-z0-9]{3}|[A-Za-z]{2}[\*|-]?[A-Za-z0-9]{3})$
                  description: 'The ProviderID is defined by Hubject and is used to identify the EMP


                    A string that `MUST` be valid with respect to the following regular expression: ISO
                    | DIN


                    `^([A-Za-z]{2}\-?[A-Za-z0-9]{3}|[A-Za-z]{2}[\*|-]?[A-Za-z0-9]{3})$`


                    The expression validates the string as ProviderID including the preceding country
                    code, which is part of EvcoID. It supports both definitions DIN SPEC 91286:2011-11
                    as well as ISO 15118-1.


                    In case the ProviderID is provided corresponding to ISO, the country code `MUST` be
                    provided as Alpha-2-Code (DIN EN ISO-3166-1) and the separator character “-” is optional.


                    Examples ISO: “DE8EO”, “DE-8EO”


                    Examples DIN: “DE8EO”, “DE*8EO”, “DE-8EO”

                    '
                  example: DE-8EO
                EvseID:
                  type: string
                  pattern: ^(([A-Za-z]{2}\*?[A-Za-z0-9]{3}\*?E[A-Za-z0-9\*]{1,30})|(\+?[0-9]{1,3}\*[0-9]{3}\*[0-9\*]{1,32}))$
                  description: 'The ID that identifies the charging spot.


