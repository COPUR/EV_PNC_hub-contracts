                  ChargingEnd:
                    type: string
                    format: date-time
                    description: The date and time at which the charging process stoped.
                  SessionStart:
                    type: string
                    format: date-time
                    description: The date and time at which the session started, e.g. swipe of RFID or
                      cable connected.
                  SessionEnd:
                    type: string
                    format: date-time
                    description: The date and time at which the session started, e.g. swipe of RFID or
                      cable connected.
                  ConsumedEnergy:
                    type: number
                    description: The difference between MeterValueEnd and MeterValueStart in kWh.
                  MeterValueStart:
                    type: number
                    description: The starting meter value in kWh.
                  MeterValueEnd:
                    type: number
                    description: The ending meter value in kWh.
                  MeterValueInBetween:
                    type: object
                    description: List of meter values that may have been taken in between (kWh).
                    properties:
