info:
  title: OICP 2.3 EMP (pinned subset)
  version: 2.3.0
  x-source: https://raw.githubusercontent.com/hubject/oicp-emp-2.3-api-doc/9a773b3a77c05264f087e73c5af04268425f9296/src/openapi.yaml
  x-commit: 9a773b3a77c05264f087e73c5af04268425f9296
