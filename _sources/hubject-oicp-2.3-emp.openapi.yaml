  /dynamicpricing/v10/providers/{providerID}/pricing-products:
    post:
      summary: eRoamingPullPricingProductData_V1.0
      operationId: eRoamingPullPricingProductData_V1.0
      description: "__Note:__\n  * To `SEND`\n  * Implementation: `OPTIONAL`\n  \n  When an EMP sends\
        \ an eRoamingPullPricingProductData request, Hubject checks whether there is a valid flexible/dynamic\
        \ pricing business contract (for the service type Authorization) between the EMP and the CPOs\
        \ whose OperatorIDs are sent in the request. If so, the operation allows the download of pricing\
        \ product data pushed to the HBS by these CPOs for the requesting EMP. When this request is received\
        \ from an EMP, currently valid pricing products data available in the HBS for the requesting EMP\
        \ (and pushed by CPOs whose OperatorIDs are supplied in the request) are grouped by OperatorID\
        \ and sent in response to the request.\n\n  The operation also allows the use of the LastCall\
        \ filter. When the LastCall filter is used, only pricing product data changes that have taken\
        \ place after the date/time value provided in the “LastCall\" field of the request are sent to\
        \ the EMP.\n"
      tags:
      - eRoamingDynamicPricing
      parameters:
      - name: providerID
        in: path
        required: true
        description: The id of the provider
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: eRoamingPullPricingProductData is a message that is sent in order to request
                the download of pricing data available in the HBS for an EMP.
              required:
              - OperatorIDs
              properties:
                LastCall:
                  type: string
                  format: date-time
                  description: In case that this field is set, Hubject does not return the entire set
                    of currently valid pricing products data but just the changes that have taken places
                    since the last call date/time value.
                OperatorIDs:
                  type: array
                  description: A list of Operator Ids in ISO or DIN standard to download pricing data
                    pushed by one or more operators.
                  items:
                    type: string
                    pattern: ^(([A-Za-z]{2}\*?[A-Za-z0-9]{3})|(\+?[0-9]{1,3}\*[0-9]{3}))$
                    description: 'A string that MUST be valid with respect to the following regular expression:
                      ISO | DIN


                      ^(([A-Za-z]{2}\*?[A-Za-z0-9]{3})|(\+?[0-9]{1,3}\*[0-9]{3}))$

                      The expression validates the string as OperatorID including the preceding country
                      code, which is part of EvseID. It supports both definitions DIN SPEC 91286:2011-11
                      as well as ISO 15118. In case the OperatorID is provided corresponding to ISO, the
                      country code MUST be provided as Alpha-2-Code (DIN EN ISO-3166-1) and the separator
                      character “*” is optional.


                      In case the OperatorID is provided corresponding to DIN, the country code MUST be
                      provided according to the international telecommunication numbering plan (ITU-T
                      E.164:11/2010) and the separator character “*” is mandatory.


                      Examples ISO: “DE*A36”, “DEA36”


                      Example DIN: “+49*536”

                      '
                    example: +49*536
              example:
                LastCall: '2020-09-23T14:33:42.246Z'
                OperatorIDs:
                - DE*ABC
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                type: object
                description: "eRoamingPricingProductData is sent in response to eRoamingPullPricingProductData\
                  \ requests.\n\nNote:\n  * This message describes the response which has to be sent in\
                  \ reply to the eRoamingPullPricingProductData request.\n"
