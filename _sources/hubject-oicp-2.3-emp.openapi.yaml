      - eRoamingAuthorization
      parameters:
      - name: providerID
        in: path
        required: true
        description: The id of the provider
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: 'eRoamingGetChargeDetailRecords is a message to request a list of charge detail
                records.


                Important:

                * This message is only mandatory for offline EMPs.

                '
              required:
              - ProviderID
              - From
              - To
              properties:
                ProviderID:
                  type: string
