              - type: object
                description: 'A customer of EMP Authorizes the charging session at particular charging
                  station (via any means for eg REFID card, Mobile etc). Due to some errors sometime,
                  it is possible that charging does not start or charging process is abruptly stopped
                  or fluctuations in the charging process. It is really important for Customer as well
                  as EMP to know what exactly is happening at the charging process. This notification
                  eventually helps EMPs well informed about the problem occurred with the charging process.
                  This information can be easily passed onto Customer so that he/she can take appropriate
                  action.


                  The CPO’s backend system MAY send a ChargingNotification of type “Error” after the CPO
                  gets an information about the error at the charging station. The CPO can transmit one
                  of the ErrorClass defined by Hubject along with the additional information which elaborated
                  the Error. The customer has to take one of the three action EV needs to be charged at
                  some different station, Cables is properly attached or the error is for information
                  only no action required by customer.


                  The ChargingNotification of type “Error” is a message that contains information about
                  the charging end of a session (e.g. ErrorClass, ErrorAdditionalInfo).

                  '
                required:
                - Type
                - SessionID
                - EvseID
                - ErrorType
                - OperatorID
                properties:
                  Type:
                    type: string
                    description: The type of ChargingNotification
                    enum:
                    - Start
                    - Progress
                    - End
                    - Error
                    example: Start
                  SessionID:
                    type: string
                    pattern: ^[A-Za-z0-9]{8}(-[A-Za-z0-9]{4}){3}-[A-Za-z0-9]{12}$
                    description: 'The Hubject SessionID that identifies the process


                      A string that `MUST` be valid with respect to the following regular expression:


                      `^[A-Za-z0-9]{8}(-[A-Za-z0-9]{4}){3}-[A-Za-z0-9]{12}$`


                      The expression validates the string as a GUID.


                      Example: “b2688855-7f00-0002-6d8e-48d883f6abb6”

                      '
                    example: b2688855-7f00-0002-6d8e-48d883f6abb6
                  CPOPartnerSessionID:
                    type: string
                    description: 'Optional field containing the session ID assigned by the CPO to the
                      related operation.


                      Partner systems can use this field to link their own session handling to HBS processes.

                      '
                    maximum: 250
                  EMPPartnerSessionID:
                    type: string
                    description: 'Optional field containing the session ID assigned by an EMP to the related
                      operation.


                      Partner systems can use this field to link their own session handling to HBS processes.

                      '
