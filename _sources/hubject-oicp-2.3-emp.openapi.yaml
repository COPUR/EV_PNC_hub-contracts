                                type: object
                                description: 'Authentication data details. The data structure differs
                                  depending on the authentication technology

                                  '
                                properties:
                                  UID:
                                    type: string
                                    pattern: ^([0-9A-F]{8,8}|[0-9A-F]{14,14}|[0-9A-F]{20,20})$
                                    description: 'Authentication data details. The data structure differs
                                      depending on the authentication technology


                                      The expression validates the string as a unique RFID with a length
                                      of 8, 14 or 20 characters.


                                      Examples: “7568290FFF765F”

                                      '
                                    example: 7568290FFF765F
                                required:
                                - UID
                                example:
                                  UID: 7568290FFF765F
                              RFIDIdentification:
                                type: object
                                description: 'Authentication data details. The data structure differs
                                  depending on the authentication technology

                                  '
                                properties:
                                  UID:
                                    type: string
                                    pattern: ^([0-9A-F]{8,8}|[0-9A-F]{14,14}|[0-9A-F]{20,20})$
                                    description: 'Authentication data details. The data structure differs
                                      depending on the authentication technology


                                      The expression validates the string as a unique RFID with a length
                                      of 8, 14 or 20 characters.


                                      Examples: “7568290FFF765F”

                                      '
                                    example: 7568290FFF765F
                                  EvcoID:
                                    type: string
                                    pattern: ^(([A-Za-z]{2}\-?[A-Za-z0-9]{3}\-?C[A-Za-z0-9]{8}\-?[\d|A-Za-z])|([A-Za-z]{2}[\*|\-]?[A-Za-z0-9]{3}[\*|\-]?[A-Za-z0-9]{6}[\*|\-]?[\d|X]))$
                                    description: 'A string that `MUST` be valid with respect to the following
                                      regular expression: ISO | DIN.


                                      ^(([A-Za-z]{2}\-?[A-Za-z0-9]{3}\-?C[A-Za-z0-9]{8}\-?[\d|A-Za-z])|([A-Za-z]{2}[\*|\-]?[A-Za-z0-9]{3}[\*|\-]?[A-Za-z0-9]{6}[\*|\-]?[\d|X]))$

                                      The expression validates the string as EvcoID. It supports both
                                      definitions DIN SPEC 91286:2011-11 as well as ISO 15118-1.


                                      In case the EvcoID is provided corresponding to ISO, the instance
                                      part MUST be eight characters long and MUST be provided with a prepended
                                      “C”. The optional separating character MUST be “-“.


                                      In case the EvcoID is provided corresponding to DIN, the instance
                                      part MUST be six characters long. The optional separating character
                                      can either be “*” or “-“.


                                      Examples ISO: “DE-8EO-CAet5e4XY-3”, “DE8EOCAet5e43X1”


                                      Examples DIN: “DE*8EO*Aet5e4*3”, “DE-8EO-Aet5e4-3”, “DE8EOAet5e43”

