                        The expression validates the string as EvseID. It supports both definitions DIN
                        SPEC 91286:2011-11 as well as ISO 15118-1.


                        In case the EvseID is provided corresponding to ISO, the country code MUST be
                        provided as Alpha-2-Code (DIN EN ISO-3166-1) and the separator character “*” is
                        optional. Furthermore the ID MUST provide an “E” after the OperatorID in order
                        to identify the ID as ISO EvseID without doubt.


                        In case the EvseID is provided corresponding to DIN, the country code MUST be
                        provided according to the international telecommunication numbering plan (ITU-T
                        E.164:11/2010) and the separator character “*” is mandatory.


                        Examples ISO: “DE*AB7*E840*6487”, “DEAB7E8406487”


                        Example DIN: “+49*810*000*438”

