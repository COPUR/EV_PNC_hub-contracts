                    `^([A-Za-z]{2}\-?[A-Za-z0-9]{3}|[A-Za-z]{2}[\*|-]?[A-Za-z0-9]{3})$`


                    The expression validates the string as ProviderID including the preceding country
                    code, which is part of EvcoID. It supports both definitions DIN SPEC 91286:2011-11
                    as well as ISO 15118-1.


                    In case the ProviderID is provided corresponding to ISO, the country code `MUST` be
                    provided as Alpha-2-Code (DIN EN ISO-3166-1) and the separator character “-” is optional.


                    Examples ISO: “DE8EO”, “DE-8EO”


                    Examples DIN: “DE8EO”, “DE*8EO”, “DE-8EO”

                    '
                  example: DE-8EO
                EvseID:
                  type: string
                  pattern: ^(([A-Za-z]{2}\*?[A-Za-z0-9]{3}\*?E[A-Za-z0-9\*]{1,30})|(\+?[0-9]{1,3}\*[0-9]{3}\*[0-9\*]{1,32}))$
