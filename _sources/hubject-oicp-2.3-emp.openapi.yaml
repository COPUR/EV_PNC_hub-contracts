                        SignedMeteringValues:
                          type: array
                          description: Metering Signature basically contains all metering signature values
                            (these values should be in Transparency software format) for different status
                            of charging session for eg start, end or progress. In total you can provide
                            maximum 10 metering signature values
                          items:
                            type: object
                            properties:
                              SignedMeteringValue:
                                type: string
                                description: 'Metering signature value (in the Transparency software format)


                                  SignedMeteringValue `SHOULD` be always sent in following order

                                  1. SignedMeteringValue for Metering Status “Start”

                                  2. SignedMeteringValue for Metering Status “Progress1”

                                  3. SignedMeteringValue for Metering Status “Progress2”

                                  4. …

                                  5. SignedMeteringValue for Metering Status “Progress8”

                                  6. SignedMeteringValue for Metering Status “End”


                                  Note:


                                  1. This field `MUST` be provided when the EVSEID in the ChargeDetailRecord
                                  contains the "External" value in the CalibrationLawDataAvailability
                                  field.

                                  2. The MeteringSignatureValue format provided `MUST` be supported by
                                  the Transparency Software used by the CPO

                                  '
                                maximum: 3000
                              MeteringStatus:
                                type: string
                                enum:
                                - Start
                                - Progress
                                - End
                                description: '| Option | Description |

                                  | ------ | ----------- |

                                  | Start | Metering signature value of the beginning of charging process.
                                  |

                                  | Progress | An intermediate metering signature value of the charging
                                  process. |

                                  | End | Metering Signature Value of the end of the charging process.
                                  |

