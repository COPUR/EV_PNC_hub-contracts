  /evsepull/v21/providers/{providerID}/status-records:
    post:
      summary: eRoamingPullEvseStatus_V2.1
      operationId: eRoamingPullEvseStatus_V2.1
      description: "__Note:__\n  * To `SEND`\n  * Implementation: `Mandatory`\n\n![Pull EVSE status](images/pullevsestatus.png)\n\
        \    \nThis operation allows downloading EVSE status data from Hubject. When an EMP sends an eRoamingPullEVSEStatus\
        \ request, Hubject identifies all currently valid EVSE status records of relevant operators.\n\
        \nHubject groups all resulting EVSE status records according to the related CPO. The response\
        \ structure contains an “EvseStatuses” node that envelopes an “OperatorEVSEStatus” node for every\
        \ CPO with currently valid and accessible status data records.\n"
      tags:
      - eRoamingEvseStatus
      parameters:
      - name: providerID
        in: path
        required: true
        description: The id of the provider
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              oneOf:
              - type: object
                description: "eRoamingPullEVSEStatus is a message that is sent in order to request the\
                  \ download of EVSE status data stored on the Hubject system\n\nTip:\n  * In case not\
                  \ all but a specific EVSE status is needed, Hubject offers the service eRoamingPullEVSEStatusByID\
                  \ and eRoamingPullEVSEStatusByOperatorID.\n  * We recommend a to send the request with\
                  \ a frequency from 1 to 5 minutes.\n"
                required:
                - ProviderID
                properties:
                  ProviderID:
                    type: string
                    pattern: ^([A-Za-z]{2}\-?[A-Za-z0-9]{3}|[A-Za-z]{2}[\*|-]?[A-Za-z0-9]{3})$
                    description: 'The ProviderID is defined by Hubject and is used to identify the EMP


                      A string that `MUST` be valid with respect to the following regular expression:
                      ISO | DIN


                      `^([A-Za-z]{2}\-?[A-Za-z0-9]{3}|[A-Za-z]{2}[\*|-]?[A-Za-z0-9]{3})$`


                      The expression validates the string as ProviderID including the preceding country
                      code, which is part of EvcoID. It supports both definitions DIN SPEC 91286:2011-11
                      as well as ISO 15118-1.


                      In case the ProviderID is provided corresponding to ISO, the country code `MUST`
                      be provided as Alpha-2-Code (DIN EN ISO-3166-1) and the separator character “-”
                      is optional.


                      Examples ISO: “DE8EO”, “DE-8EO”


                      Examples DIN: “DE8EO”, “DE*8EO”, “DE-8EO”

                      '
                    example: DE-8EO
                  SearchCenter:
                    type: object
                    description: The data can be restricted using search parameters that are provided
                      in this field.
                    required:
                    - GeoCoordinates
                    - Radius
                    properties:
                      GeoCoordinates:
                        type: object
                        description: 'Important


                          __One of the following three options `MUST` be provided__

                          '
                        properties:
                          Google:
                            type: object
                            description: 'Geocoordinates using Google Structure

                              Based on WGS84

                              '
                            required:
                            - Coordinates
                            properties:
                              Coordinates:
                                type: string
                                pattern: ^-?1?\d{1,2}\.\d{1,6}\s*\,?\s*-?1?\d{1,2}\.\d{1,6}$
                                description: 'A string that `MUST` be valid with respect to the following
                                  regular expression:


                                  `^-?1?\d{1,2}\.\d{1,6}\s*\,?\s*-?1?\d{1,2}\.\d{1,6}$`

                                  The expression validates the string as geo coordinates with respect
                                  to the Google standard. The string contains latitude and longitude (in
                                  this sequence) separated by a space.


                                  Example: “47.662249 9.360922”

                                  '
                                example: 47.662249 9.360922
                          DecimalDegree:
                            type: object
                            description: Geocoordinates using DecimalDegree Structure
                            required:
                            - Longitude
                            - Latitude
                            properties:
                              Longitude:
                                type: string
                                pattern: ^-?1?\d{1,2}\.\d{1,6}$
                                description: 'A string that `MUST` be valid with respect to the following
                                  regular expression:


                                  `^-?1?\d{1,2}\.\d{1,6}$`

                                  The expression validates the string as a geo coordinate (longitude or
                                  latitude) with decimal degree syntax.


                                  Examples: “9.360922”, “-21.568201”

                                  '
                                example: '9.360922'
                              Latitude:
                                type: string
                                pattern: ^-?1?\d{1,2}\.\d{1,6}$
                                description: 'A string that `MUST` be valid with respect to the following
                                  regular expression:


                                  `^-?1?\d{1,2}\.\d{1,6}$`

                                  The expression validates the string as a geo coordinate (longitude or
                                  latitude) with decimal degree syntax.


                                  Examples: “9.360922”, “-21.568201”

                                  '
                                example: '9.360922'
                          DegreeMinuteSeconds:
                            type: object
                            description: Geocoordinates using DegreeMinutesSeconds Structure
                            required:
                            - Longitude
                            - Latitude
                            properties:
                              Longitude:
                                type: string
                                pattern: ^-?1?\d{1,2}°[ ]?\d{1,2}'[ ]?\d{1,2}\.\d+''$
                                description: 'A string that `MUST` be valid with respect to the following
                                  regular expression:


                                  `^-?1?\d{1,2}°[ ]?\d{1,2}''[ ]?\d{1,2}\.\d+''''$`

                                  The expression validates the string as a geo coordinate (longitude or
                                  latitude) consisting of degree, minutes, and seconds


                                  Examples: “9°21''39.32''''”, “-21°34''23.16''''

                                  '
                                example: 9°21'39.32''
                              Latitude:
                                type: string
                                pattern: ^-?1?\d{1,2}°[ ]?\d{1,2}'[ ]?\d{1,2}\.\d+''$
                                description: 'A string that `MUST` be valid with respect to the following
                                  regular expression:


                                  `^-?1?\d{1,2}°[ ]?\d{1,2}''[ ]?\d{1,2}\.\d+''''$`

                                  The expression validates the string as a geo coordinate (longitude or
                                  latitude) consisting of degree, minutes, and seconds


                                  Examples: “9°21''39.32''''”, “-21°34''23.16''''

                                  '
                                example: 9°21'39.32''
                      Radius:
                        type: number
                        description: Radius in km around the position that is defined by the geo coordinates
                  EVSEStatus:
                    type: string
                    enum:
                    - Available
                    - Reserved
                    - Occupied
                    - OutOfService
                    - EvseNotFound
                    - Unknown
                    description: "| Option | Description |                \n| ------ | ----------- |\n\
                      | Available | Charging Spot is available for charging. |\n| Reserved | Charging\
                      \ Spot is reserved and not available for charging. |\n| Occupied | Charging Spot\
                      \ is busy. |\n| OutOfService | Charging Spot is out of service and not available\
                      \ for charging. |\n| EvseNotFound | The requested EvseID and EVSE status does not\
                      \ exist within the Hubject database. |\n| Unknown | No status information available.\
                      \ |"
                example:
                  EvseStatus: Available
                  ProviderID: DE-DCB
                  SearchCenter:
                    GeoCoordinates:
                      Google:
                        Coordinates: 52.480495 13.356465
                      DecimalDegree:
                        Latitude: '52.480495'
                        Longitude: '13.356465'
                      DegreeMinuteSeconds:
                        Latitude: 9°21'39.32''
                        Longitude: 9°21'39.32''
                    Radius: 0
              - type: object
                description: 'eRoamingPullEVSEStatusByID is a message that is sent in order to request
                  the EVSE status data for specific EVSE IDs.

                  '
