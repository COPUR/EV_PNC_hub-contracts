  /cdrmgmt/v22/operators/{operatorID}/charge-detail-record:
    post:
      summary: eRoamingChargeDetailRecord_V2.2
      operationId: eRoamingChargeDetailRecord_V2.2
      description: "__Note:__\n  * To `RECEIVE`\n  * Implementation: `MANDATORY`\n\n![Charge Detail Record\
        \ diagram](images/cdr.png)\n\n__Functional Description:__\n\nScenario:\n\nA customer of an EMP\
        \ has charged a vehicle at a charging station of a CPO. The charging process was started with\
        \ an eRoamingAuthorizeStart or an eRoamingAuthorizeRemoteStart operation. The process may have\
        \ been stopped with an eRoamingAuthorizeStop or an eRoamingAuthorizeRemoteStop operation. A preceding\
        \ stop request is not a necessary precondition for the processing of an eRoamingChargeDetailRecord\
        \ request. The CPO’s provider system `MUST` send an eRoamingChargeDetailRecord (CDR) after the\
        \ end of the charging process in order to inform the EMP of the charging session data (e.g. meter\
        \ values and consumed energy) and further charging process details.\n\nNote:\n\nThe CPO `MUST`\
        \ provide the same SessionID that was assigned to the corresponding charging process. Based on\
        \ this information Hubject will be able to assign the session data to the correct process.\n\n\
        Hubject will identify the receiving EMP and will forward the CDR to the corresponding EMP. The\
        \ EMP `MUST` return an eRoamingAcknowledgement message that `MUST` contain the result indicating\
        \ whether the session data was received successfully and that `MAY` contain a status code for\
        \ further information.\n\nHubject will accept only one CDR per SessionID.\n\nIn addition to forwarding\
        \ the CDR to the EMP, Hubject also stores the CDR. In case that the recipient provider’s system\
        \ cannot be addressed (e.g. due to technical problems), Hubject will nevertheless return to the\
        \ requestor a positive result provided that storing the CDR was successful.\n"
      tags:
      - eRoamingAuthorization
      parameters:
      - name: operatorID
        in: path
        required: true
        description: The id of the operator
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: eRoamingChargeDetailRecord is a message that contains charging process details
                (e.g. meter values).
              required:
              - SessionID
              - EvseID
              - Identification
              - ChargingStart
              - ChargingEnd
              - SessionStart
              - SessionEnd
              - ConsumedEnergy
              properties:
                SessionID:
                  type: string
                  pattern: ^[A-Za-z0-9]{8}(-[A-Za-z0-9]{4}){3}-[A-Za-z0-9]{12}$
                  description: 'The Hubject SessionID that identifies the process


                    A string that `MUST` be valid with respect to the following regular expression:


                    `^[A-Za-z0-9]{8}(-[A-Za-z0-9]{4}){3}-[A-Za-z0-9]{12}$`


                    The expression validates the string as a GUID.


                    Example: “b2688855-7f00-0002-6d8e-48d883f6abb6”

                    '
                  example: b2688855-7f00-0002-6d8e-48d883f6abb6
                CPOPartnerSessionID:
                  type: string
                  maximum: 250
                  description: Optional field containing the session id assigned by the CPO to the related
                    operation.
                EMPPartnerSessionID:
                  type: string
                  maximum: 250
                  description: Optional field containing the session id assigned by an EMP to the related
                    operation.
                PartnerProductID:
                  type: string
                  description: 'The ProductIDType defines some standard values (see below). The type however
                    also supports custom ProductIDs that can be specified by partners (as a string of
                    50 characters maximum length).

                    | Option | Description |

                    |--------|-------------|

                    | Standard Price | Standard Price |

                    | AC1 | Product for AC 1 Phase charging |

                    | AC3 | Product for AC 3 Phase charging |

                    | DC | Product for DC charging |

                    | CustomProductID | There is no option “CustomProductID”, this sample option is meant
                    to indicates that custom product ID specifications by partners (as a string of 50
                    characters maximum length) are allowed as well.|

                    '
                  example: AC1
                  maximum: 50
                EvseID:
                  type: string
                  pattern: ^(([A-Za-z]{2}\*?[A-Za-z0-9]{3}\*?E[A-Za-z0-9\*]{1,30})|(\+?[0-9]{1,3}\*[0-9]{3}\*[0-9\*]{1,32}))$
                  description: 'The ID that identifies the charging spot.


                    A string that `MUST` be valid with respect to the following regular expression: ISO
                    | DIN.


                    `^(([A-Za-z]{2}\*?[A-Za-z0-9]{3}\*?E[A-Za-z0-9\*]{1,30})|(\+?[0-9]{1,3}\*[0-9]{3}\*[0-9\*]{1,32}))$`

                    The expression validates the string as EvseID. It supports both definitions DIN SPEC
                    91286:2011-11 as well as ISO 15118-1.


                    In case the EvseID is provided corresponding to ISO, the country code MUST be provided
                    as Alpha-2-Code (DIN EN ISO-3166-1) and the separator character “*” is optional. Furthermore
                    the ID MUST provide an “E” after the OperatorID in order to identify the ID as ISO
                    EvseID without doubt.


                    In case the EvseID is provided corresponding to DIN, the country code MUST be provided
                    according to the international telecommunication numbering plan (ITU-T E.164:11/2010)
                    and the separator character “*” is mandatory.


                    Examples ISO: “DE*AB7*E840*6487”, “DEAB7E8406487”


                    Example DIN: “+49*810*000*438”

                    '
                  example: +49*810*000*438
                Identification:
                  type: object
                  description: 'Authentication data


                    1. The option RFIDIdentification `MUST` not be used in the eRoamingAuthorization process.
                    For RFID Authorization, only the option RFIDMifareFamilyIdentification `SHOULD` be
                    used in the respective eRoamingAuthorization messages.

                    2. For the Remote Authorization process, only the option RemoteIdentification MUST
