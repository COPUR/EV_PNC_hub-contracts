                            expression: ISO | DIN


                            ^(([A-Za-z]{2}\*?[A-Za-z0-9]{3})|(\+?[0-9]{1,3}\*[0-9]{3}))$

                            The expression validates the string as OperatorID including the preceding
                            country code, which is part of EvseID. It supports both definitions DIN SPEC
                            91286:2011-11 as well as ISO 15118. In case the OperatorID is provided corresponding
                            to ISO, the country code MUST be provided as Alpha-2-Code (DIN EN ISO-3166-1)
                            and the separator character “*” is optional.


                            In case the OperatorID is provided corresponding to DIN, the country code
                            MUST be provided according to the international telecommunication numbering
                            plan (ITU-T E.164:11/2010) and the separator character “*” is mandatory.


                            Examples ISO: “DE*A36”, “DEA36”


                            Example DIN: “+49*536”

                            '
                          example: +49*536
                        OperatorName:
                          type: string
                          description: Free text for operator
                          maximum: 100
