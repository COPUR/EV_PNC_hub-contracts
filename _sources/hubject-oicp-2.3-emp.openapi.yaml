                                    '
                                  example: '9.360922'
                            DegreeMinuteSeconds:
                              type: object
                              description: Geocoordinates using DegreeMinutesSeconds Structure
                              required:
                              - Longitude
                              - Latitude
                              properties:
                                Longitude:
                                  type: string
                                  pattern: ^-?1?\d{1,2}°[ ]?\d{1,2}'[ ]?\d{1,2}\.\d+''$
