  /evsepull/v23/providers/{providerID}/data-records:
    post:
      summary: eRoamingPullEvseData_V2.3
      operationId: eRoamingPullEvseData_V2.3
      description: "__Note:__\n  * To `SEND`\n  * Implementation: `MANDATORY`\n\n![Pull evse data diagram](images/pullevsedata.png)\n\
        \nThis operation allows downloading EVSEData from Hubject. When an EMP sends an eRoamingPullEVSEData\
        \ request, Hubject identifies all currently valid EVSEData records of relevant operators.\n\n\
        For every EVSE data record Hubject identifies the timestamp of the last update, which has been\
        \ performed on the record. The timestamp is returned with the attribute “lastUpdate”.\n\n__Delta\
        \ pull:__\n\nAs mentioned above, the operation by default returns all currently valid EVSE data\
        \ records. However, the requesting EMP has the possibility to download only the changes (delta)\
        \ compared to a certain time in the past. In order to do so, the EMP MUST provide the optional\
        \ date/time field “LastCall”, indicating his last EVSE pull request. In case that Hubject receives\
        \ the LastCall parameter, Hubject compares the EVSE records from the time of the last call with\
        \ the currently valid records. As a result, Hubject assigns the attribute “deltaType” (possible\
        \ values: insert, update, delete) to every response EVSE data record indicating whether the particular\
        \ record has been inserted, updated or deleted in the meantime. EVSE data records that have not\
        \ changed will not be part of the response.\n\nNote:\n* The delta pull option cannot be combined\
        \ with radial search, because in some cases this could lead to data inconsistency on the EMP’s\
        \ side. This is why the API only allows the provision of either the attribute “SearchCenter” or\
        \ “LastCall”.\n\n__Pagination:__\n\nStarting from OICP 2.3, eRoamingPullEvseData uses pagination.\
        \ This is an implementation that EMPs `MUST` use in order to divide the amount of EvseDataRecords\
        \ contained in the response of the pull request.\n\nThe parameters of the pagination are given\
        \ at the end of the end point: `…​?page=0&size=20` where `page` indicates the number of the page\
        \ for the response and `size` the amount of records to be provided in the response.\n\nImportant:\n\
        * __The default number of records provided in the eRoamingEvseData response is 20 elements.__\n"
      tags:
      - eRoamingEvseData
      parameters:
      - name: providerID
        in: path
        required: true
        description: The id of the provider
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              description: eRoamingPullEVSEData is a message that is sent in order to request the download
                of EVSE data of operators stored on the Hubject system.
              required:
              - ProviderID
              - GeoCoordinatesResponseFormat
              properties:
                ProviderID:
                  type: string
                  pattern: ^([A-Za-z]{2}\-?[A-Za-z0-9]{3}|[A-Za-z]{2}[\*|-]?[A-Za-z0-9]{3})$
                  description: 'The ProviderID is defined by Hubject and is used to identify the EMP


                    A string that `MUST` be valid with respect to the following regular expression: ISO
                    | DIN


                    `^([A-Za-z]{2}\-?[A-Za-z0-9]{3}|[A-Za-z]{2}[\*|-]?[A-Za-z0-9]{3})$`


                    The expression validates the string as ProviderID including the preceding country
                    code, which is part of EvcoID. It supports both definitions DIN SPEC 91286:2011-11
                    as well as ISO 15118-1.


                    In case the ProviderID is provided corresponding to ISO, the country code `MUST` be
                    provided as Alpha-2-Code (DIN EN ISO-3166-1) and the separator character “-” is optional.


                    Examples ISO: “DE8EO”, “DE-8EO”


                    Examples DIN: “DE8EO”, “DE*8EO”, “DE-8EO”

                    '
                  example: DE-8EO
                SearchCenter:
                  type: object
                  description: '"The data can be restricted using search parameters that are provided
                    in this field.


                    Cannot be combined with “LastCall”."

                    '
                  required:
                  - GeoCoordinates
                  - Radius
                  properties:
                    GeoCoordinates:
                      type: object
                      description: 'Important


                        __One of the following three options `MUST` be provided__

                        '
                      properties:
                        Google:
                          type: object
                          description: 'Geocoordinates using Google Structure

                            Based on WGS84

                            '
                          required:
                          - Coordinates
                          properties:
                            Coordinates:
                              type: string
                              pattern: ^-?1?\d{1,2}\.\d{1,6}\s*\,?\s*-?1?\d{1,2}\.\d{1,6}$
                              description: 'A string that `MUST` be valid with respect to the following
                                regular expression:


                                `^-?1?\d{1,2}\.\d{1,6}\s*\,?\s*-?1?\d{1,2}\.\d{1,6}$`

                                The expression validates the string as geo coordinates with respect to
                                the Google standard. The string contains latitude and longitude (in this
                                sequence) separated by a space.


                                Example: “47.662249 9.360922”

                                '
                              example: 47.662249 9.360922
                        DecimalDegree:
                          type: object
                          description: Geocoordinates using DecimalDegree Structure
                          required:
                          - Longitude
                          - Latitude
                          properties:
                            Longitude:
                              type: string
                              pattern: ^-?1?\d{1,2}\.\d{1,6}$
                              description: 'A string that `MUST` be valid with respect to the following
                                regular expression:


                                `^-?1?\d{1,2}\.\d{1,6}$`

                                The expression validates the string as a geo coordinate (longitude or
                                latitude) with decimal degree syntax.


                                Examples: “9.360922”, “-21.568201”

                                '
                              example: '9.360922'
                            Latitude:
                              type: string
                              pattern: ^-?1?\d{1,2}\.\d{1,6}$
                              description: 'A string that `MUST` be valid with respect to the following
                                regular expression:


                                `^-?1?\d{1,2}\.\d{1,6}$`

                                The expression validates the string as a geo coordinate (longitude or
                                latitude) with decimal degree syntax.


                                Examples: “9.360922”, “-21.568201”

                                '
                              example: '9.360922'
                        DegreeMinuteSeconds:
                          type: object
                          description: Geocoordinates using DegreeMinutesSeconds Structure
                          required:
                          - Longitude
                          - Latitude
                          properties:
                            Longitude:
                              type: string
                              pattern: ^-?1?\d{1,2}°[ ]?\d{1,2}'[ ]?\d{1,2}\.\d+''$
                              description: 'A string that `MUST` be valid with respect to the following
                                regular expression:


                                `^-?1?\d{1,2}°[ ]?\d{1,2}''[ ]?\d{1,2}\.\d+''''$`

                                The expression validates the string as a geo coordinate (longitude or
                                latitude) consisting of degree, minutes, and seconds


                                Examples: “9°21''39.32''''”, “-21°34''23.16''''

                                '
                              example: 9°21'39.32''
                            Latitude:
                              type: string
                              pattern: ^-?1?\d{1,2}°[ ]?\d{1,2}'[ ]?\d{1,2}\.\d+''$
                              description: 'A string that `MUST` be valid with respect to the following
                                regular expression:


                                `^-?1?\d{1,2}°[ ]?\d{1,2}''[ ]?\d{1,2}\.\d+''''$`

                                The expression validates the string as a geo coordinate (longitude or
                                latitude) consisting of degree, minutes, and seconds


                                Examples: “9°21''39.32''''”, “-21°34''23.16''''

                                '
                              example: 9°21'39.32''
                    Radius:
                      type: number
                      description: Radius in km around the position that is defined by the geo coordinates
                LastCall:
                  type: string
                  format: date-time
                  description: 'In case that this field is set, Hubject does not return the currently
                    valid set of EVSE data but the changes compared to the status of EVSE data at the
                    time of the last call. Cannot be combined with “SearchCenter”, “CountryCodes”, and
                    “OperatorIDs”. '
                GeoCoordinatesResponseFormat:
                  type: string
                  description: Defines the format of geo coordinates that shall be provided with the response.
                  enum:
                  - Google
                  - DegreeMinuteSeconds
                  - DecimalDegree
                CountryCodes:
                  type: array
                  description: A list of countries whose EVSE’s a provider wants to retrieve. Cannot be
                    combined with “LastCall”.
                  items:
                    type: string
                    description: 'The CountryCodeType allows for Alpha-3 country codes only as of OICP
                      2.2 and OICP 2.3


                      For Alpha-3 (three-letter) country codes as defined in ISO 3166-1.


                      __Examples:__


                      | Option | Description |

                      | ------ | ----------- |

                      | AUT | Austria |

                      | DEU | Germany |

                      | FRA | France |

                      | USA | United States |

                      '
                    maximum: 3
                    minimum: 3
                OperatorIds:
                  type: array
                  description: A list of Operator Ids in ISO or DIN standard to download only EVSE’s of
                    one or more operators. Cannot be combined with “LastCall”.
                  items:
                    type: string
                    pattern: ^(([A-Za-z]{2}\*?[A-Za-z0-9]{3})|(\+?[0-9]{1,3}\*[0-9]{3}))$
                    description: 'A string that MUST be valid with respect to the following regular expression:
                      ISO | DIN


                      ^(([A-Za-z]{2}\*?[A-Za-z0-9]{3})|(\+?[0-9]{1,3}\*[0-9]{3}))$

                      The expression validates the string as OperatorID including the preceding country
                      code, which is part of EvseID. It supports both definitions DIN SPEC 91286:2011-11
                      as well as ISO 15118. In case the OperatorID is provided corresponding to ISO, the
                      country code MUST be provided as Alpha-2-Code (DIN EN ISO-3166-1) and the separator
                      character “*” is optional.


                      In case the OperatorID is provided corresponding to DIN, the country code MUST be
                      provided according to the international telecommunication numbering plan (ITU-T
                      E.164:11/2010) and the separator character “*” is mandatory.


                      Examples ISO: “DE*A36”, “DEA36”


                      Example DIN: “+49*536”

                      '
                    example: +49*536
                AuthenticationModes:
                  type: array
                  description: A list of Authentication Modes to start a charging process
                  items:
                    type: string
                    enum:
                    - NFC RFID Classic
                    - NFC RFID DESFire
                    - PnC
                    - REMOTE
                    - Direct Payment
                    - No Authentication Required
                    description: '| Option | Description |

                      | NFC RFID Classic | Defined authentication. |

                      | NFC RFID DESFire | Defined authentication. |

                      | PnC | ISO/IEC 15118. |

                      | REMOTE | App, QR-Code, Phone. |

                      | Direct Payment | Remote use via direct payment. E.g. intercharge direct |

                      | No Authentication Required | Not Authentication Method Required |'
                Accessibility:
                  type: array
                  description: A list of accessibility of the charging point
                  items:
                    type: string
                    enum:
                    - Free publicly accessible
                    - Restricted access
                    - Paying publicly accessible
                    - Test Station
                    description: 'Specifies how the charging station can be accessed.


                      | Option | Description |

                      | ------ | ----------- |

                      | Free publicly accessible | EV Driver can reach the charging point without paying
                      a fee, e.g. street, free public place, free parking lot, etc. |

                      | Restricted access | EV Driver needs permission to reach the charging point, e.g.
                      Campus, building complex, etc. |

                      | Paying publicly accessible | EV Driver needs to pay a fee in order to reach the
                      charging point, e.g. payable parking garage, etc. |

                      | Test Station | Station is just for testing purposes. Access may be restricted.
                      |

                      '
                    example: Free publicly accessible
                CalibrationLawDataAvailability:
                  type: array
                  description: A list of how caliration law data is provided by the charging point
                  items:
                    type: string
                    enum:
                    - Local
                    - External
                    - Not Available
                RenewableEnergy:
                  type: boolean
                  description: Select the charging stations use Renewable energy or not
                IsHubjectCompatible:
                  type: boolean
                  description: Select if the charging station is Hubject Compatible
                IsOpen24Hours:
                  type: boolean
                  description: Select the charging stations that are open 24 hours.
              example:
                AuthenticationModes:
                - PnC
                Accessibility:
                - Free publicly accessible
                CalibrationLawDataAvailability:
                - Local
                CountryCodes:
                - DEU
                GeoCoordinatesResponseFormat: Google
                IsHubjectCompatible: true
                IsOpen24Hours: true
                LastCall: '2020-09-23T14:27:43.052Z'
                OperatorIds:
                - DE*ABC
                ProviderID: DE-DCB
                RenewableEnergy: true
                SearchCenter:
                  GeoCoordinates:
                    Google:
                      Coordinates: 52.480495 13.356465
                    DecimalDegree:
                      Latitude: '52.480495'
                      Longitude: '13.356465'
                    DegreeMinuteSeconds:
                      Latitude: 9°21'39.32''
                      Longitude: 9°21'39.32''
                  Radius: 0
      responses:
        '200':
          description: Expected response to a valid request
          content:
            application/json:
              schema:
                type: object
                required:
                - content
                - number
                - size
                - totalElements
                - last
                - totalPages
                - first
                - numberOfElements
                - StatusCode
                properties:
                  content:
                    type: array
                    description: A list of EVSE data blocks that are each assigned to a certain operator.
                    items:
                      type: object
                      required:
                      - EvseID
                      - ChargingStationNames
                      - Address
                      - GeoCoordinates
                      - Plugs
                      - ChargingFacilities
                      - RenewableEnergy
                      - CalibrationLawDataAvailability
                      - AuthenticationModes
                      - PaymentOptions
                      - ValueAddedServices
                      - Accessibility
                      - HotlinePhoneNumber
                      - IsOpen24Hours
                      - IsHubjectCompatible
                      - DynamicInfoAvailable
                      - OperatorID
                      - OperatorName
                      properties:
                        deltaType:
                          type: string
                          enum:
                          - update
                          - insert
                          - delete
                          description: In case that the operation “PullEvseData” is performed with the
                            parameter “LastCall”, Hubject assigns this attribute to every response EVSE
                            record in order to return the changes compared to the last call.
                        lastUpdate:
                          type: string
                          format: date-time
                          description: The attribute indicates the date and time of the last update of
                            the record. Hubject assigns this attribute to every response EVSE record.
                        EvseID:
                          type: string
                          pattern: ^(([A-Za-z]{2}\*?[A-Za-z0-9]{3}\*?E[A-Za-z0-9\*]{1,30})|(\+?[0-9]{1,3}\*[0-9]{3}\*[0-9\*]{1,32}))$
                          description: 'The ID that identifies the charging spot.


                            A string that `MUST` be valid with respect to the following regular expression:
                            ISO | DIN.


                            `^(([A-Za-z]{2}\*?[A-Za-z0-9]{3}\*?E[A-Za-z0-9\*]{1,30})|(\+?[0-9]{1,3}\*[0-9]{3}\*[0-9\*]{1,32}))$`

                            The expression validates the string as EvseID. It supports both definitions
                            DIN SPEC 91286:2011-11 as well as ISO 15118-1.


                            In case the EvseID is provided corresponding to ISO, the country code MUST
                            be provided as Alpha-2-Code (DIN EN ISO-3166-1) and the separator character
                            “*” is optional. Furthermore the ID MUST provide an “E” after the OperatorID
                            in order to identify the ID as ISO EvseID without doubt.


                            In case the EvseID is provided corresponding to DIN, the country code MUST
                            be provided according to the international telecommunication numbering plan
                            (ITU-T E.164:11/2010) and the separator character “*” is mandatory.


                            Examples ISO: “DE*AB7*E840*6487”, “DEAB7E8406487”


                            Example DIN: “+49*810*000*438”

                            '
                          example: +49*810*000*438
                        ChargingPoolID:
                          type: string
                          pattern: ([A-Za-z]{2}\*?[A-Za-z0-9]{3}\*?P[A-Za-z0-9\*]{1,30})
                          description: 'VSEs may be grouped by using a charging pool id according to emi³
                            standard definition. The Evse Pool ID MUST match the following structure (the
                            notation corresponds to the augmented Backus-Naur Form (ABNF) as defined in
                            RFC5234):

                            <Evse Pool ID> = <Country Code> <S> <Spot Operator ID> <S> <ID Type> <Pool
                            ID>


                            with:


                            <Country Code> = 2 ALPHA ; two character country code according to ISO-3166-1
                            (Alpha-2-Code).


                            <Spot Operator ID> = 3 (ALPHA / DIGIT); three alphanumeric characters.


                            <ID Type> = “P”; one character “P” indicating that this ID represents a “Pool”.


                            <Pool Instance> = (ALPHA / DIGIT) 1 * 30 ( 1*(ALPHA / DIGIT) [/ <S>] ); between
                            1 and 31sequence of alphanumeric characters, including additional optional
                            separators. Starts with alphanumeric character referring to a specific Pool
                            in EVSE Operator data system.


                            ALPHA = %x41-5A / %x61-7A; according to RFC 5234 (7-Bit ASCII).


                            DIGIT = %x30-39; according to RFC 5234 (7-Bit ASCII).


                            <S> = *1 ( “*” ); optional separator


                            An example for a valid Evse Pool ID is “IT*123*P456*AB789” with :


                            “IT” indicating Italy,


                            “123” representing a particular Spot Operator,


                            “P” indicating the Pool, and


                            “456*AB789” representing one of its POOL.


                            Note


                            In contrast to the eMA ID, no check digit is specified for the Evse Pool ID
                            in this document. Alpha characters SHALL be interpreted case insensitively.
                            emi³ strongly recommends that implementations SHOULD - use the separator between
                            Country Code and Spot Operator ID - use the separator between Spot Operator
                            ID and ID type

                            This leads to the following regular expression:


                            `([A-Za-z]{2}\*?[A-Za-z0-9]{3}\*?P[A-Za-z0-9\*]{1,30})`


                            This regular expression is similar to that of the ISO EvseIDType but E is
                            replaced with P to indicate a pool.

                            '
                          example: IT*123*P456*AB789
